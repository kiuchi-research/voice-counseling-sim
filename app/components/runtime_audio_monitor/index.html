          interruptPayloadForRuntimeStatus(status, options),
        );
      }

      async function interruptPlaybackForHumanBargeIn() {
        if (activeSources.size > 0) {
          const interrupted = await interruptActiveMainPlayback(
            {},
            { reason: "human_barge_in" },
          );
          if (interrupted) {
            return true;
          }
        }
        let status = latestRuntimeStatus;
        if (!runtimeStatusAllowsAlwaysBargeIn(status)) {
          const fetchedStatus = await fetchRuntimeStatus();
          if (fetchedStatus) {
            updateRuntimeInlineStateFromStatus(fetchedStatus);
            status = fetchedStatus;
          }
        }
        return interruptRuntimePlaybackFromStatus(status, {
          reason: "human_barge_in",
        });
      }

      function humanAudioStreamUrl() {
        const explicitUrl = String(args.human_audio_stream_url || "").trim();
        if (explicitUrl) {
          return explicitUrl;
        }
        const humanAudioUrl = String(args.human_audio_url || "").trim();
        if (!humanAudioUrl) {
          return "";
        }
        try {
          const url = new URL(humanAudioUrl, window.location.href);
          url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
          url.pathname = url.pathname.replace(/\/runtime\/human-audio$/, "/runtime/human-audio-stream");
          return url.toString();
        } catch (error) {
          return "";
        }
      }

      function humanSessionId() {
        return sessionEl.textContent && sessionEl.textContent !== "-"
          ? sessionEl.textContent
          : "";
      }

      function humanClientMessageId() {
        return `human-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function openHumanAudioStream() {
        const streamUrl = humanAudioStreamUrl();
        if (!streamUrl || !window.WebSocket) {
          return Promise.resolve(false);
        }
        closeHumanAudioStream({ sendEnd: false });
        humanStreamingClientMessageId = humanClientMessageId();
        humanStreamingError = "";
        humanStreamingChunkIndex = 0;
        humanStreamingChunkAckIndex = -1;
        humanStreamingChunkAckWaiters = [];
        humanStreamingReady = false;
        humanStreamingEnded = false;
        return new Promise((resolve, reject) => {
          const socket = new WebSocket(streamUrl);
          const sessionId = humanSessionId();
          const clientMessageId = humanStreamingClientMessageId;
          let settled = false;
          const settle = (value, error) => {
            if (settled) {
              return;
            }
            settled = true;
            if (error) {
              reject(error);
            } else {
              resolve(value);
            }
          };
          const fail = (error) => {
            if (humanStreamingSocket !== socket) {
              settle(false);
              return;
            }
            const wasAccepted = settled;
            humanStreamingError = error.message;
            settle(false, error);
            if (wasAccepted) {
              cleanupHumanRecording();
              resetHumanAlwaysAutoStopDetection();
              resetHumanAlwaysBargeInControllerState();
              resetHumanAlwaysPendingPreRoll();
              resetHumanAlwaysRestartState();
              setHumanStatus(error.message);
              resumeAlwaysMonitorIfIdle();
            }
          };
          socket.addEventListener("open", () => {
            if (humanStreamingSocket !== socket) {
              socket.close();
              settle(false);
              return;
            }
            socket.send(
              JSON.stringify({
                type: "start",
                session_id: sessionId,
                sample_rate: 24000,
                channels: 1,
                recording_mode: humanAlwaysRecordingEnabled
                  ? "browser_vad"
                  : "push_to_talk",
                recipient_ids: humanRecipientIds(),
                client_message_id: clientMessageId,
              }),
            );
          });
          socket.addEventListener("message", (event) => {
            if (humanStreamingSocket !== socket) {
              return;
            }
            let message = {};
            try {
              message = JSON.parse(String(event.data || "{}"));
            } catch (error) {
              message = {};
            }
            if (message.type === "accepted") {
              humanStreamingReady = true;
              settle(true);
              return;
            }
            if (message.type === "completed") {
              completeHumanRecordingFromServer(message);
              settle(true);
              return;
            }
            if (message.type === "end_received" && message.pending_transcription) {
              setHumanStatus("音声を受信しました。文字起こしを確定しています。");
              return;
            }
            if (message.type === "chunk_received") {
              noteHumanAudioStreamChunkAck(message.chunk_index);
              return;
            }
            if (message.type === "error") {
              fail(new Error(message.message || "human audio stream failed"));
            }
          });
          socket.addEventListener("error", () => {
            fail(new Error("human audio stream connection failed"));
          });
          socket.addEventListener("close", () => {
            if (humanStreamingSocket !== socket) {
              settle(false);
              return;
            }
            fail(new Error("human audio stream closed before completion"));
          });
          humanStreamingSocket = socket;
        });
      }

      function maybeAutoStopAlwaysRecordingFromLevel(
        peak, rms, elapsedMs, sampleDurationMs = 0, allowStop = true,
      ) {
        if (
          !humanAlwaysRecordingEnabled ||
          !humanRecording ||
          !humanStreamingReady ||
          humanAlwaysAutoStopRequested
        ) {
          return false;
        }
        // Count voiced audio across short unvoiced gaps within words. Requiring
        // consecutive worklet frames misses natural speech and short answers.
        const now = elapsedMs;
        const durationMs = sampleDurationMs || Math.max(
          0, elapsedMs - humanAlwaysAutoStopLastSampleMs,
        );
        humanAlwaysAutoStopLastSampleMs = elapsedMs;
        const speechDetected =
          peak >= HUMAN_ALWAYS_AUTO_STOP_SPEECH_PEAK ||
          rms >= HUMAN_ALWAYS_AUTO_STOP_SPEECH_RMS;
        if (speechDetected) {
          humanAlwaysAutoStopSpeechActiveMs += durationMs;
          humanAlwaysAutoStopLastSpeechAt = now;
          if (
            humanAlwaysAutoStopSpeechActiveMs >=
            HUMAN_ALWAYS_AUTO_STOP_SPEECH_CONFIRM_MS
          ) {
            humanAlwaysAutoStopSpeechDetected = true;
          }
          return false;
        }
        const silentEnough =
          peak <= HUMAN_ALWAYS_AUTO_STOP_SILENCE_PEAK &&
          rms <= HUMAN_ALWAYS_AUTO_STOP_SILENCE_RMS;
        if (!silentEnough) humanAlwaysAutoStopLastSpeechAt = now;
        if (
          allowStop && humanRecordingStartedByBargeIn &&
          !humanAlwaysAutoStopSpeechDetected &&
          elapsedMs >= HUMAN_ALWAYS_FALSE_START_CANCEL_MS &&
          silentEnough &&
          now - humanAlwaysAutoStopLastSpeechAt >= HUMAN_ALWAYS_AUTO_STOP_SILENCE_MS
        ) {
          humanAlwaysAutoStopRequested = true;
          void cancelAlwaysBargeInFalseStart();
          return true;
        }
        if (!humanAlwaysAutoStopSpeechDetected) {
          if (now - humanAlwaysAutoStopLastSpeechAt >= HUMAN_ALWAYS_AUTO_STOP_SILENCE_MS) {
            humanAlwaysAutoStopSpeechActiveMs = 0;
          }
          return false;
        }
        if (!silentEnough) {
          // Quieter speech still breaks the continuous-silence window.
          humanAlwaysAutoStopLastSpeechAt = now;
          return false;
        }
        if (
          allowStop && silentEnough &&
          elapsedMs >= HUMAN_ALWAYS_AUTO_STOP_MIN_RECORDING_MS &&
          now - humanAlwaysAutoStopLastSpeechAt >= HUMAN_ALWAYS_AUTO_STOP_SILENCE_MS
        ) {
          humanAlwaysAutoStopRequested = true;
          setHumanStatus("always detected silence; sending");
          void stopHumanRecordingAndSubmit();
          return true;
        }
        return false;
      }

      function observeHumanPcmBuffersForAutoStop(buffers, sampleRate) {
        if (!humanAlwaysRecordingEnabled || !sampleRate) return;
        const detectionGain = humanInputGainValue();
        buffers.forEach((buffer, index) => {
          const stats = floatSignalStats(buffer);
          const detectionPeak = Math.round(stats.peak * detectionGain);
          const detectionRms = Math.round(stats.rms * detectionGain);
          const durationMs = buffer.length * 1000 / sampleRate;
          humanAlwaysAutoStopAudioMs += durationMs;
          maybeAutoStopAlwaysRecordingFromLevel(
            detectionPeak, detectionRms, humanAlwaysAutoStopAudioMs, durationMs,
            // Inspect all queued/pre-roll audio before deciding to end.
            index === buffers.length - 1,
          );
        });
      }

      function completeHumanRecordingFromServer(message) {
        const wasAlwaysRecording = Boolean(humanAlwaysRecordingEnabled);
        const hadActiveHumanRecording = Boolean(
          humanRecording ||
            humanRecordingStarting ||
            humanMediaRecorder ||
            humanStreamingSocket,
        );
        if (!hadActiveHumanRecording) {
          return;
        }
        const completedSocket = humanStreamingSocket;
        humanStreamingSocket = null;
        humanStreamingEnded = true;
        humanStreamingReady = false;
        clearHumanAudioStreamChunkAckWaiters();
        cleanupHumanRecording({ closeStream: false });
        humanStreamingClientMessageId = "";
        if (completedSocket) {
          completedSocket.close();
        }
        if ((message || {}).completion_reason === "blank_transcript") {
          resetHumanAlwaysRestartState();
          humanAlwaysVadInputAllowed = false;
          humanAlwaysAiResumePending = Boolean(wasAlwaysRecording && message.resume_pending);
          humanStreamingError = humanAlwaysAiResumePending
            ? "" : "音声を認識できませんでした。もう一度話してください。";
          setHumanStatus(humanAlwaysAiResumePending
            ? "発話を確認できなかったため、まもなくAIが話を再開します。"
            : humanStreamingError);
          resumeAlwaysMonitorIfIdle();
          return;
        }
        if ((message || {}).completion_reason === "aborted") {
          resetHumanAlwaysRestartState();
          humanAlwaysVadInputAllowed = false;
          setHumanStatus("録音を取り消しました。");
          return;
        }
        if (wasAlwaysRecording) {
          resetHumanAlwaysAutoStopDetection();
          resetHumanAlwaysBargeInControllerState();
          resetHumanAlwaysPendingPreRoll();
          humanAlwaysVadInputAllowed = false;
          if (String((message || {}).text || "").trim()) {
            humanAlwaysVadRestartPending = true;
            humanAlwaysVadSawRuntimeBusy = false;
          } else {
            resetHumanAlwaysRestartState();
          }
          resumeAlwaysMonitorIfIdle();
          setHumanStatus(runtimeIsHumanClientMode()
            ? "送信しました。カウンセラーの応答を待っています。"
            : "always sent; monitoring");
          return;
        }
        setHumanStatus(runtimeIsHumanClientMode()
          ? "送信しました。カウンセラーの応答を待っています。"
          : "sent");
      }

      function noteHumanAudioStreamChunkAck(chunkIndex) {
        const numericChunkIndex = Number(chunkIndex);
        if (!Number.isFinite(numericChunkIndex) || numericChunkIndex < 0) {
          return;
        }
        humanStreamingChunkAckIndex = Math.max(
          humanStreamingChunkAckIndex,
          Math.floor(numericChunkIndex),
        );
        const pendingWaiters = humanStreamingChunkAckWaiters;
        humanStreamingChunkAckWaiters = [];
        pendingWaiters.forEach((waiter) => {
          if (humanStreamingChunkAckIndex >= waiter.chunkIndex) {
            window.clearTimeout(waiter.timer);
            waiter.resolve(true);
          } else {
            humanStreamingChunkAckWaiters.push(waiter);
          }
        });
      }

      function clearHumanAudioStreamChunkAckWaiters() {
        const pendingWaiters = humanStreamingChunkAckWaiters;
        humanStreamingChunkAckWaiters = [];
        pendingWaiters.forEach((waiter) => {
          window.clearTimeout(waiter.timer);
          waiter.resolve(false);
        });
      }

      function waitForHumanAudioStreamChunkAck(chunkIndex) {
        if (chunkIndex < 0 || humanStreamingChunkAckIndex >= chunkIndex) {
          return Promise.resolve(true);
        }
        return new Promise((resolve) => {
          const waiter = {
            chunkIndex,
            resolve,
            timer: window.setTimeout(() => {
              humanStreamingChunkAckWaiters = humanStreamingChunkAckWaiters.filter(
                (item) => item !== waiter,
              );
              resolve(false);
            }, HUMAN_AUDIO_STREAM_END_ACK_WAIT_MS),
          };
          humanStreamingChunkAckWaiters.push(waiter);
        });
      }

      async function closeHumanAudioStream({ sendEnd } = { sendEnd: true }) {
        const socket = humanStreamingSocket;
        humanStreamingReady = false;
        if (!socket) {
          humanStreamingEnded = true;
          clearHumanAudioStreamChunkAckWaiters();
          return;
        }
        if (sendEnd && !humanStreamingEnded && socket.readyState === WebSocket.OPEN) {
          let finalChunkIndex = humanStreamingChunkIndex - 1;
          if (humanStreamingChunkIndex <= 0) {
            finalChunkIndex = sendHumanAudioStreamSilenceChunk(socket);
          }
          const finalChunkAcknowledged =
            await waitForHumanAudioStreamChunkAck(finalChunkIndex);
          if (humanStreamingSocket !== socket) {
            return;
          }
          if (
            !finalChunkAcknowledged &&
            !humanStreamingEnded &&
            socket.readyState === WebSocket.OPEN
          ) {
            finalChunkIndex = sendHumanAudioStreamSilenceChunk(socket);
            await waitForHumanAudioStreamChunkAck(finalChunkIndex);
          }
          if (humanStreamingSocket !== socket) {
            return;
          }
          if (!humanStreamingEnded && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: "end" }));
          }
          humanStreamingEnded = true;
          clearHumanAudioStreamChunkAckWaiters();
          if (runtimeIsHumanClientMode()) return;
          window.setTimeout(() => {
            if (socket.readyState === WebSocket.OPEN) {
              try {
                socket.close();
              } catch (error) {
                // The socket may already be closed by the server.
              }
            }
          }, 1200);
          return;
        }
        if (!sendEnd && runtimeIsHumanClientMode() && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "abort" }));
        }
        humanStreamingSocket = null;
        humanStreamingClientMessageId = "";
        humanStreamingEnded = true;
        clearHumanAudioStreamChunkAckWaiters();
        try {
          socket.close();
        } catch (error) {
          // The socket may already be closed by the server.
        }
      }

      function stopHumanMediaRecorderFallbackStreaming() {
        if (humanMediaRecorderFallbackTimer !== null) {
          window.clearInterval(humanMediaRecorderFallbackTimer);
          humanMediaRecorderFallbackTimer = null;
        }
        humanMediaRecorderFallbackPcmBytesSent = 0;
        humanMediaRecorderFallbackActive = false;
        humanMediaRecorderFallbackDecoding = null;
      }

      async function streamHumanMediaRecorderFallbackPcm() {
        if (
          !humanRecording ||
          !humanAlwaysRecordingEnabled ||
          !humanStreamingReady ||
          humanMediaRecorderFallbackDecoding ||
          !humanMediaRecorder ||
          humanRecordingChunks.length === 0
        ) {
          return;
        }
        if (!humanMediaRecorderFallbackActive &&
            (humanStreamingChunkIndex > 0 || humanCapturePeak > 0)) {
          return;
        }
        const decoding = {
          socket: humanStreamingSocket,
          recorder: humanMediaRecorder,
          attemptId: humanRecordingAttemptId,
        };
        humanMediaRecorderFallbackDecoding = decoding;
        let pcm = null;
        try {
          pcm = await decodeHumanRecordingToPcm(
            humanRecordingChunks.slice(),
            decoding.recorder.mimeType,
            24000,
          );
        } catch (error) {
          return;
        } finally {
          if (humanMediaRecorderFallbackDecoding === decoding) {
            humanMediaRecorderFallbackDecoding = null;
          }
        }
        // PCM may have arrived, or the recording may have changed, during decode.
        if (!humanRecording || !humanStreamingReady ||
            humanStreamingSocket !== decoding.socket ||
            humanMediaRecorder !== decoding.recorder ||
            humanRecordingAttemptId !== decoding.attemptId ||
            (!humanMediaRecorderFallbackActive && humanStreamingChunkIndex > 0)) {
          return;
        }
        if (!pcm || pcm.byteLength <= humanMediaRecorderFallbackPcmBytesSent) {
          return;
        }
        const stats = pcmSignalStats(pcm);
        if (!humanMediaRecorderFallbackActive) {
          if (!pcmHasSignal(pcm)) {
            return;
          }
          humanMediaRecorderFallbackActive = true;
          setHumanStatus("media recorder fallback listening");
        }
        humanCapturePeak = Math.max(humanCapturePeak, stats.peak);
        humanCaptureRms = Math.max(humanCaptureRms, stats.rms);
        humanCaptureChannelSummary = `media recorder fallback peak ${stats.peak} rms ${stats.rms}`;
        const sentIndex = sendHumanAudioStreamChunk(
          pcm.slice(humanMediaRecorderFallbackPcmBytesSent),
          { source: "media_recorder" },
        );
        if (sentIndex >= 0) humanMediaRecorderFallbackPcmBytesSent = pcm.byteLength;
      }

      function startHumanMediaRecorderFallbackStreaming() {
        stopHumanMediaRecorderFallbackStreaming();
        humanMediaRecorderFallbackTimer = window.setInterval(() => {
          void streamHumanMediaRecorderFallbackPcm();
        }, 700);
      }

      async function cancelAlwaysBargeInFalseStart() {
        if (!humanRecordingStartedByBargeIn) {
          return false;
        }
        setHumanStatus("割り込み音声の文字起こしを確認しています。");
        await stopHumanRecordingAndSubmit();
        return true;
      }

      function sendHumanAudioStreamChunk(
        pcmBytes,
        { requireRecording = true, source = "pcm" } = {},
      ) {
        if (
          (source === "pcm" && humanMediaRecorderFallbackActive) ||
          (source === "media_recorder" && !humanMediaRecorderFallbackActive) ||
          (requireRecording && !humanRecording) ||
          !humanStreamingReady ||
          !humanStreamingSocket ||
          humanStreamingSocket.readyState !== WebSocket.OPEN ||
          !pcmBytes ||
          pcmBytes.byteLength === 0
        ) {
          return -1;
        }
        const chunkIndex = humanStreamingChunkIndex;
        humanStreamingSocket.send(
          JSON.stringify({
            type: "chunk",
            audio_base64: bytesToBase64(pcmBytes),
            chunk_index: chunkIndex,
          }),
        );
        humanStreamingChunkIndex += 1;
        return chunkIndex;
      }

      function sendHumanAudioStreamSilenceChunk(socket) {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          return -1;
        }
        const frameCount = Math.ceil(24000 * HUMAN_AUDIO_STREAM_MIN_END_MS / 1000);
        const pcmBytes = new Uint8Array(frameCount * 2);
        const chunkIndex = humanStreamingChunkIndex;
        socket.send(
          JSON.stringify({
            type: "chunk",
            audio_base64: bytesToBase64(pcmBytes),
            chunk_index: chunkIndex,
          }),
        );
        humanStreamingChunkIndex += 1;
        return chunkIndex;
      }

      function resetHumanAlwaysMonitorPreRoll() {
        humanAlwaysMonitorBuffers = [];
        humanAlwaysMonitorFrameCount = 0;
        humanAlwaysMonitorSampleRate = 0;
      }

      function beginHumanInitialInputPreRollCapture() {
        if (!humanAlwaysRecordingEnabled) {
          return false;
        }
        resetHumanAlwaysMonitorPreRoll();
        humanInitialInputPreRollActive = true;
        return true;
      }

      function cancelHumanInitialInputPreRollCapture({ clearBuffer } = { clearBuffer: true }) {
        humanInitialInputPreRollActive = false;
        if (clearBuffer) {
          resetHumanAlwaysMonitorPreRoll();
        }
      }

      function resetHumanAlwaysPendingPreRoll() {
        humanAlwaysPendingPreRoll = null;
      }

      function appendHumanAlwaysMonitorPreRoll(buffer) {
        if (!humanAlwaysRecordingEnabled || !buffer || buffer.length <= 0) {
          return;
        }
        const sampleRate = humanCaptureSampleRate || humanAlwaysMonitorSampleRate || 0;
        if (sampleRate <= 0) {
          return;
        }
        humanAlwaysMonitorSampleRate = sampleRate;
        humanAlwaysMonitorBuffers.push(buffer);
        humanAlwaysMonitorFrameCount += buffer.length;
        const maxFrames = Math.max(
          buffer.length,
          Math.round(
            sampleRate *
              (humanInitialInputPreRollActive
                ? HUMAN_INITIAL_INPUT_PREROLL_MS
                : HUMAN_ALWAYS_MONITOR_PREROLL_MS) /
              1000,
          ),
        );
        while (
          humanAlwaysMonitorBuffers.length > 0 &&
          humanAlwaysMonitorFrameCount > maxFrames
        ) {
          const removed = humanAlwaysMonitorBuffers.shift();
          humanAlwaysMonitorFrameCount -= removed ? removed.length : 0;
        }
      }

      function startHumanLevelMeter(stream) {

              process(inputs) {

                  const sampleCount = input[0].length;
                  const mixed = new Float32Array(sampleCount);
                  const channelPeaks = new Float32Array(input.length);

                        channelPeaks[channelIndex],
                        absSample,

                      channelPowers[channelIndex] / Math.max(1, sampleCount),
                    );

                    let bestChannelPower = 0;
                    for (let channelIndex = 0; channelIndex < channelPowers.length; channelIndex += 1) {
                      if (channelPowers[channelIndex] > bestChannelPower) {
                        bestChannelPower = channelPowers[channelIndex];
                        bestChannelIndex = channelIndex;
                      }

                    let mixedPower = 0;
                    for (let sampleIndex = 0; sampleIndex < sampleCount; sampleIndex += 1) {
                      const averaged = mixed[sampleIndex] / channelCount;
                      mixed[sampleIndex] = averaged;

                      bestChannelPower > 0 &&
                      mixedPower < bestChannelPower * MIN_AVERAGE_POWER_RATIO &&

                    channelPeaks,
                    channelRms,
                    channelCount,
                    selectedChannelIndex,

              const detectionPeak = Math.round(stats.peak * detectionGain);

                maybeStartAlwaysBargeInFromLevel(detectionPeak, detectionRms, durationMs);

              humanCaptureFrameCount += buffer.length;
              humanCapturePeak = Math.max(humanCapturePeak, stats.peak);

          humanCaptureContext = null;
        }
        return { buffers, sampleRate, frameCount, peak, rms, streamedBufferCount };
      }

      function preferredHumanRecorderMimeType() {
        const candidates = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/ogg;codecs=opus",
        ];
        for (const candidate of candidates) {
          if (
            MediaRecorder.isTypeSupported &&
            MediaRecorder.isTypeSupported(candidate)
          ) {
            return candidate;
          }
        }
        return "";
      }

      async function decodeHumanRecordingToPcm(chunks, mimeType, outputSampleRate) {
        const blob = new Blob(chunks, { type: mimeType || "audio/webm" });
        const arrayBuffer = await blob.arrayBuffer();
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const decodeContext = new AudioContextClass();
        try {
          const audioBuffer = await decodeContext.decodeAudioData(arrayBuffer);
          return encodeHumanAudioBufferPcm(audioBuffer, outputSampleRate);
        } finally {
          void decodeContext.close();
        }
      }

      function encodeHumanAudioBufferPcm(audioBuffer, outputSampleRate) {
        const inputSampleRate = audioBuffer.sampleRate;
        const inputLength = audioBuffer.length;
        const ratio = inputSampleRate / outputSampleRate;
        const outputLength = Math.max(0, Math.floor(inputLength / ratio));
        const pcm = new Int16Array(outputLength);
        const channels = Math.max(1, audioBuffer.numberOfChannels);
        const inputGain = humanInputGainValue();
        const preferredChannelIndex = preferredHumanAudioBufferChannelIndex(
          audioBuffer,
        );
        for (let index = 0; index < outputLength; index += 1) {
          const sourceIndex = Math.min(inputLength - 1, Math.floor(index * ratio));
          let mixed = 0;
          if (preferredChannelIndex >= 0) {
            mixed =
              audioBuffer.getChannelData(preferredChannelIndex)[sourceIndex] || 0;
          } else {
            for (let channelIndex = 0; channelIndex < channels; channelIndex += 1) {
              mixed += audioBuffer.getChannelData(channelIndex)[sourceIndex] || 0;
            }
            mixed /= channels;
          }
          const sample = Math.max(-1, Math.min(1, mixed * inputGain));
          pcm[index] = sample < 0 ? sample * 32768 : sample * 32767;
        }
        return new Uint8Array(pcm.buffer);
      }

      function preferredHumanAudioBufferChannelIndex(audioBuffer) {
        const channels = Math.max(1, audioBuffer.numberOfChannels);
        if (channels <= 1 || audioBuffer.length <= 0) {
          return -1;
        }
        const channelPowers = new Array(channels).fill(0);
        let mixedPower = 0;
        for (let index = 0; index < audioBuffer.length; index += 1) {
          let mixed = 0;
          for (let channelIndex = 0; channelIndex < channels; channelIndex += 1) {
            const sample = audioBuffer.getChannelData(channelIndex)[index] || 0;
            mixed += sample;
            channelPowers[channelIndex] += sample * sample;
          }
          const averaged = mixed / channels;
          mixedPower += averaged * averaged;
        }
        let bestChannelIndex = 0;
        let bestChannelPower = 0;
        for (let channelIndex = 0; channelIndex < channels; channelIndex += 1) {
          if (channelPowers[channelIndex] > bestChannelPower) {
            bestChannelPower = channelPowers[channelIndex];
            bestChannelIndex = channelIndex;
          }
        }
        const shouldUseBestChannel =
          bestChannelPower > 0 &&
          mixedPower <
            bestChannelPower * HUMAN_CHANNEL_MIX_MIN_AVERAGE_POWER_RATIO;
        return shouldUseBestChannel ? bestChannelIndex : -1;
      }

      function encodeHumanFloatBuffersPcm(buffers, inputSampleRate, outputSampleRate) {
        const safeInputSampleRate = inputSampleRate || outputSampleRate;
        const inputLength = buffers.reduce((total, buffer) => total + buffer.length, 0);
        if (inputLength <= 0) {
          return new Uint8Array(0);
        }
        const merged = new Float32Array(inputLength);
        let offset = 0;
        buffers.forEach((buffer) => {
          merged.set(buffer, offset);
          offset += buffer.length;
        });
        const ratio = safeInputSampleRate / outputSampleRate;
        const outputLength = Math.max(0, Math.floor(merged.length / ratio));
        const pcm = new Int16Array(outputLength);
        const inputGain = humanInputGainValue();
        for (let index = 0; index < outputLength; index += 1) {
          const sourceIndex = Math.min(merged.length - 1, Math.floor(index * ratio));
          const sample = Math.max(
            -1,
            Math.min(1, (merged[sourceIndex] || 0) * inputGain),
          );
          pcm[index] = sample < 0 ? sample * 32768 : sample * 32767;
        }
        return new Uint8Array(pcm.buffer);
      }

      function pcmHasSignal(pcmBytes) {
        return pcmSignalStats(pcmBytes).peak >= 2;
      }

      function floatSignalStats(samples) {
        let peak = 0;
        let sumSquares = 0;
        for (let index = 0; index < samples.length; index += 1) {
          const sample = Math.abs(samples[index] || 0);
          peak = Math.max(peak, sample);
          sumSquares += sample * sample;
        }
        return {
          peak: Math.round(peak * 1000),
          rms: Math.round(Math.sqrt(sumSquares / Math.max(1, samples.length)) * 1000),
        };
      }

      function pcmSignalStats(pcmBytes) {
        const view = new DataView(
          pcmBytes.buffer,
          pcmBytes.byteOffset,
          pcmBytes.byteLength,
        );
        let peak = 0;
        let sumSquares = 0;
        let sampleCount = 0;
        for (let offset = 0; offset + 1 < pcmBytes.byteLength; offset += 2) {
          const sample = Math.abs(view.getInt16(offset, true));
          peak = Math.max(peak, sample);
          sumSquares += sample * sample;
          sampleCount += 1;
        }
        return {
          peak,
          rms: Math.round(Math.sqrt(sumSquares / Math.max(1, sampleCount))),
        };
      }

      function describeMicrophoneError(error) {
        const name = error && error.name ? error.name : "";
        if (name === "NotAllowedError" || name === "PermissionDeniedError") {
          return "microphone permission denied";
        }
        if (name === "NotFoundError" || name === "DevicesNotFoundError") {
          return "microphone not found";
        }
        if (name === "NotReadableError" || name === "TrackStartError") {
          return "microphone is already in use";
        }
        if (name === "OverconstrainedError" || name === "ConstraintNotSatisfiedError") {
          return "selected microphone unavailable";
        }
        return error && error.message ? error.message : String(error);
      }

      function bytesToBase64(bytes) {
        let binary = "";
        const chunkSize = 0x8000;
        for (let offset = 0; offset < bytes.length; offset += chunkSize) {
          const chunk = bytes.subarray(offset, offset + chunkSize);
          binary += String.fromCharCode.apply(null, chunk);
        }
        return window.btoa(binary);
      }

      async function submitHumanAudioRecording(pcmBytes, sampleRate, channels) {
        const sessionId = sessionEl.textContent && sessionEl.textContent !== "-"
          ? sessionEl.textContent
          : "";
        const payload = {
          session_id: sessionId,
          audio_base64: bytesToBase64(pcmBytes),
          sample_rate: sampleRate,
          channels,
          recording_mode: "push_to_talk",
          recipient_ids: humanRecipientIds(),
          client_message_id: `human-${Date.now()}-${Math.random().toString(36).slice(2)}`,
        };
        setHumanStatus("transcribing");
        try {
          const response = await window.fetch(args.human_audio_url, {
            method: "POST",
            mode: "cors",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });
          const responseText = await response.text();
          let result = {};
          if (responseText) {
            try {
              result = JSON.parse(responseText);
            } catch (error) {
              result = { detail: responseText };
            }
          }
          if (!response.ok) {
            throw new Error(result.detail || `human audio failed: ${response.status}`);
          }
          if (result && result.accepted === false) {
            setHumanStatus(
              result.reason === "blank_transcript" ? "no speech recognized" : "not accepted",
            );
            return;
          }
          handleHumanAudioSubmitResult(result, payload);
          setHumanStatus(result.pending_transcription ? "transcribing" : "sent");
        } catch (error) {
          setHumanStatus(error && error.message ? error.message : String(error));
        }
      }

      function handleHumanAudioSubmitResult(result, payload) {
        const transcript = String((result || {}).transcript || "").trim();
        if (!transcript) {
          return;
        }
        const speaker = String((result || {}).speaker || humanSpeakerId());
        const sessionId = String(
          (result || {}).session_id ||
            payload.session_id ||
            (sessionEl.textContent && sessionEl.textContent !== "-" ? sessionEl.textContent : ""),
        );
        const turnId = (result || {}).turn_id === undefined ? null : (result || {}).turn_id;
        const metadata = {
          session_id: sessionId,
          turn_id: turnId,
          speaker,
          speaker_id: speaker,
          display_name: humanSpeakerDisplayName(speaker),
          role: (runtimeParticipants()[speaker] || {}).role || speaker,
          actor_kind: "human",
          recipient_ids: payload.recipient_ids || [],
          transcript_type: "human_final",
          text_source: "human_mic_stt",
          segment_id: `${sessionId}:${turnId}:${speaker}`,
        };
        updateMetadata(metadata);
        handleTranscriptMessage(
          {
            type: "transcript_final",
            text: transcript,
            metadata,
          },
          true,
        );
      }

      function humanSpeakerDisplayName(speaker) {
        const participant = runtimeParticipants()[speaker] || {};
        return (
          participant.display_name ||
          participant.displayName ||
          (speaker === "counselor" ? "カウンセラー" : speaker === "client" ? "クライアント" : speaker)
        );
      }

      function humanRecipientIds() {
        if (runtimeStatusIndicatesStarted(latestRuntimeStatus) &&
            Array.isArray((latestRuntimeStatus || {}).human_recipient_ids)) {
          return latestRuntimeStatus.human_recipient_ids;
        }
        const participants = runtimeParticipants();
        const human = humanSpeakerId();
        const ids = Object.keys(participants).filter(id => id !== human && participants[id].actor_kind !== "human");
        return ids.length > 0 ? ids : runtimeIsHumanClientMode() ? [] : ["client"];
      }

      function scheduleReconnect() {
        if (
          reconnectTimer !== null ||
          reconnectAttempts >= MAX_RECONNECT_ATTEMPTS ||
          !isMonitorArmed()
        ) {
          return;
        }
        reconnectAttempts += 1;
        const delay = Math.min(
          RECONNECT_MAX_DELAY_MS,
          RECONNECT_BASE_DELAY_MS * reconnectAttempts,
        );
        setStatus(`closed; reconnecting ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS}`);
        reconnectTimer = window.setTimeout(() => {
          reconnectTimer = null;
          if (isMonitorArmed()) {
            connectMonitor({ userGesture: false, allowPendingAudio: true });
          }
        }, delay);
      }

      async function connectMonitor(options = { userGesture: false }) {
        const nextOptions = Object.assign(
          {
            userGesture: false,
            allowPendingAudio: false,
            resetTimelineOnOpen: false,
          },
          options || {},
        );
        const userGesture = Boolean(nextOptions.userGesture);
        const allowPendingAudio = Boolean(nextOptions.allowPendingAudio);
        const resetTimelineOnOpen = Boolean(nextOptions.resetTimelineOnOpen);
        if (!args.ws_url) {
          setStatus("missing ws url");
          return false;
        }
        if (!userGesture && !allowPendingAudio && (!audioContext || audioContext.state !== "running")) {
          setStatus("click Connect & Start audio");
          return false;
        }
        if (!userGesture && allowPendingAudio && !canPlayAudio()) {
          setStatus("click Connect & Start audio");
          return false;
        }
        clearReconnectTimer();
        if (userGesture) {
          setArmedMonitor();
          manualDisconnect = false;
          streamEnded = false;
          reconnectAttempts = 0;
        }

        let context = audioContext;
        if (userGesture || audioContext) {
          context = ensureAudioContext();
          if (userGesture && context.state === "suspended") {
            await context.resume();
          }
        }
        if (!allowPendingAudio && context && context.state === "suspended") {
          setStatus("audio_context_suspended");
          return false;
        }
        if (userGesture || (isMonitorArmed() && canPlayAudio())) {
          claimActiveMonitor();
        }
        if (socket && [WebSocket.CONNECTING, WebSocket.OPEN].includes(socket.readyState)) {
          if (canPlayAudio()) {
            setStatus("connected; waiting for runtime audio");
          } else {
            setStatus("connected; click Connect & Start audio to hear audio");
          }
          return socket.readyState === WebSocket.OPEN;
        }

        manualDisconnect = false;
        streamEnded = false;
        setStatus("connecting");
        const currentSocket = new WebSocket(args.ws_url);
        socket = currentSocket;
        const opened = new Promise((resolve) => {
          currentSocket.addEventListener("open", () => resolve(socket === currentSocket));
          currentSocket.addEventListener("close", () => resolve(false), { once: true });
          currentSocket.addEventListener("error", () => resolve(false), { once: true });
        });
        currentSocket.addEventListener("open", () => {
          if (socket !== currentSocket) {
            return;
          }
          reconnectAttempts = 0;
          resetPlaybackLanes();
          if (resetTimelineOnOpen) {
            resetTimelineDisplay();
          }
          if (canPlayAudio()) {
            setStatus("connected; waiting for runtime audio");
          } else {
            setStatus("connected; click Connect & Start audio to hear audio");
          }
        });
        currentSocket.addEventListener("message", async (event) => {
          if (socket !== currentSocket) {
            return;
          }
          try {
            const message = JSON.parse(event.data);
            if (message.type === "audio_chunk") {
              if (audioPlaybackPaused) {
                queuePausedPlaybackMessage(message);
                return;
              }
              if (maybeBufferWarmupMessage(message)) {
                return;
              }
              handleAudioChunkMessage(message);
            } else if (message.type === "turn_end") {
              if (audioPlaybackPaused) {
                queuePausedPlaybackMessage(message);
                return;
              }
              if (maybeBufferWarmupMessage(message)) {
                return;
              }
              handleTurnEndMessage(message);
            } else if (message.type === "transcript_delta") {
              handleTranscriptMessage(message, false);
            } else if (message.type === "transcript_final") {
              handleTranscriptMessage(message, true);
            } else if (message.type === "transcript_interrupted") {
              handleTranscriptInterruptedMessage(message);
            } else if (message.type === "transcript_invalidated") {
              handleTranscriptInvalidatedMessage(message);
            } else if (message.type === "stream_end") {
              if (warmupActive) {
                flushWarmupPlaybackBuffer("stream_end");
              }
              const status = await fetchRuntimeStatus();
              if (status) {
                updateRuntimeInlineStateFromStatus(status);
                await maybeResumeAlwaysHumanRecordingFromStatus(status);
              } else {
                updateRuntimeStartRequestedFromStatus({ phase: "stopped" });
                setRuntimeInlineState("", "");
              }
              streamEnded = !runtimeStartRequested;
              clearAllPcmRemainders();
              refreshTimelineTimer();
              setStatus(
                runtimeStartRequested
                  ? "stream end; reconnecting for next audio"
                  : "stream end",
              );
            } else if (message.type === "error") {
              cancelWarmupBuffering();
              setStatus(message.message || "monitor error");
            }
          } catch (error) {
            setStatus(error && error.message ? error.message : String(error));
          }
        });
        currentSocket.addEventListener("close", (event) => {
          if (socket !== currentSocket) {
            return;
          }
          socket = null;
          const reason = event.reason ? ` ${event.reason}` : "";
          cancelWarmupBuffering();
          setStatus(`closed ${event.code}${reason}`);
          if (!manualDisconnect && !streamEnded) {
            scheduleReconnect();
          }
        });
        currentSocket.addEventListener("error", () => {
          if (socket !== currentSocket) {
            return;
          }
          cancelWarmupBuffering();
          setStatus("websocket error; check RuntimeControlAPI and ws_url");
        });
        return opened;
      }

      async function startRuntimeWithAudio() {
        const alreadyConnected = Boolean(
          socket && [WebSocket.CONNECTING, WebSocket.OPEN].includes(socket.readyState)
        );
        const wasAudioPaused = Boolean(
          audioPlaybackPaused ||
            pausedPlaybackMessages.length > 0 ||
            (audioContext && audioContext.state === "suspended")
        );
        const captureInitialHumanInput = Boolean(
          !runtimeStartRequested && !runtimeIsHumanClientMode() && beginHumanInitialInputPreRollCapture()
        );
        if (captureInitialHumanInput) {
          setHumanStatus("preparing initial human input");
          const microphoneReady = await ensureHumanMicrophoneEnabled();
          if (!microphoneReady) {
            cancelHumanInitialInputPreRollCapture();
            return;
          }
          await startAlwaysBargeInCaptureMonitor();
        }
        const connected = await connectMonitor({
          userGesture: true,
          resetTimelineOnOpen: !alreadyConnected,
        });
        if (!connected) {
          if (captureInitialHumanInput) {
            cancelHumanInitialInputPreRollCapture();
          }
          return;
        }
        if (alreadyConnected && runtimeStartRequested) {
          audioPlaybackPaused = false;
          const flushed = flushPausedPlaybackMessages();
          await resumeRuntimeGenerationForPlayback();
          setStatus(
            wasAudioPaused && flushed
              ? "already connected; audio resumed"
              : "already connected; waiting for runtime audio",
          );
          return;
        }
        if (!args.start_url) {
          if (captureInitialHumanInput) {
            cancelHumanInitialInputPreRollCapture();
          }
          setStatus("missing start url");
          return;
        }
        if (alreadyConnected) {
          resetTimelineDisplay();
        }
        const useWarmup = !runtimeHasHumanInput() && (warmupTargetTurns() > 0 || warmupMinChunks() > 0);
        if (useWarmup) {
          beginWarmupBuffering();
        } else {
          cancelWarmupBuffering();
        }
        setStatus(
          useWarmup && alreadyConnected
            ? "starting runtime; monitor connected; 先行生成中"
            : useWarmup
              ? "starting runtime; 先行生成中"
              : "starting runtime; waiting for human input",
        );
        try {
          const response = await window.fetch(args.start_url, {
            method: "POST",
            mode: "cors",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(normalizeStartOptions(args.start_options || {})),
          });
          const responseText = await response.text();
          let payload = {};
          if (responseText) {
            try {
              payload = JSON.parse(responseText);
            } catch (error) {
              payload = { detail: responseText };
            }
          }
          if (!response.ok) {
            throw new Error(payload.detail || `runtime start failed: ${response.status}`);
          }
          runtimeStartRequested = payload.phase !== "completed" && payload.phase !== "stopped";
          updateRuntimeInlineStateFromStatus(payload);
          if (payload.session_id) {
            sessionEl.textContent = payload.session_id;
          }
          if (!runtimeStartRequested || payload.phase === "paused") {
            cancelWarmupBuffering();
          }
          if (payload.phase === "paused") {
            setStatus("runtime paused; resume generation first");
          } else if (warmupActive) {
            setStatus("先行生成中");
          } else if (payload.phase === "running") {
            setStatus("runtime running; waiting for audio");
          } else {
            setStatus("runtime started; waiting for audio");
          }
          if (humanAlwaysRecordingEnabled) {
            await maybeResumeAlwaysHumanRecordingFromStatus(payload);
          }
        } catch (error) {
          if (captureInitialHumanInput) {
            cancelHumanInitialInputPreRollCapture();
          }
          cancelWarmupBuffering();
          setStatus(error && error.message ? error.message : String(error));
        }
      }

      async function postRuntimeControl(url, failurePrefix, payload) {
        if (!url) {
          setStatus(`${failurePrefix}: missing url`);
          return false;
        }
        const bodyPayload = payload || {};
        try {
          const response = await window.fetch(url, {
            method: "POST",
            mode: "cors",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(bodyPayload),
          });
          const responseText = await response.text();
          let payload = {};
          if (responseText) {
            try {
              payload = JSON.parse(responseText);
            } catch (error) {
              payload = { detail: responseText };
            }
          }
          if (!response.ok) {
            throw new Error(payload.detail || `${failurePrefix}: ${response.status}`);
          }
          updateRuntimeStartRequestedFromStatus(payload);
          updateRuntimeInlineStateFromStatus(payload);
          if (payload.session_id) {
            sessionEl.textContent = payload.session_id;
          }
          if (payload.current_turn_id !== undefined && payload.current_turn_id !== null) {
            turnEl.textContent = String(payload.current_turn_id);
          }
          if (payload.current_speaker) {
            speakerEl.textContent = payload.current_speaker;
          }
          return true;
        } catch (error) {
          setStatus(error && error.message ? error.message : String(error));
          return false;
        }
      }

      async function pauseRuntimeGenerationForPlayback() {
        return postRuntimeControl(args.runtime_pause_url, "runtime pause failed", {
          reason: "playback",
        });
      }

      async function resumeRuntimeGenerationForPlayback() {
        return postRuntimeControl(args.runtime_resume_url, "runtime resume failed");
      }

      async function stopRuntimeForRecovery() {
        return postRuntimeControl(args.runtime_stop_url, "runtime stop failed");
      }

      async function pauseAudioPlayback() {
        if (runtimeIsHumanClientMode()) {
          audioPlaybackPaused = true;
          cleanupHumanRecording();
          resetHumanAlwaysRestartState();
          setHumanStatus("録音を取り消しました。Resume後に再開できます。");
        }
        if (!audioContext || audioContext.state === "closed") {
          setStatus("click Connect & Start audio");
          return;
        }
        audioPlaybackPaused = true;
        refreshTimelineTimer();
        if (audioContext.state === "suspended") {
          const runtimePaused = await pauseRuntimeGenerationForPlayback();
          setStatus(runtimePaused ? "audio paused" : "audio paused; runtime pause not confirmed");
          return;
        }
        try {
          await audioContext.suspend();
          const runtimePaused = await pauseRuntimeGenerationForPlayback();
          setStatus(runtimePaused ? "audio paused" : "audio paused; runtime pause not confirmed");
        } catch (error) {
          setStatus(error && error.message ? error.message : String(error));
        }
      }

      async function resumeAudioPlayback() {
        if (!audioContext || audioContext.state === "closed") {
          setStatus("click Connect & Start audio");
          return;
        }
        if (audioContext.state === "running") {
          audioPlaybackPaused = false;
          const flushed = flushPausedPlaybackMessages();
          refreshTimelineTimer();
          const runtimeResumed = await resumeRuntimeGenerationForPlayback();
          setStatus(
            runtimeResumed
              ? flushed
                ? "audio_context_running"
                : "audio resumed; waiting for audio"
              : "audio resumed; runtime resume not confirmed",
          );
          return;
        }
        try {
          await audioContext.resume();
          audioPlaybackPaused = false;
          claimActiveMonitor();
          const flushed = flushPausedPlaybackMessages();
          refreshTimelineTimer();
          const runtimeResumed = await resumeRuntimeGenerationForPlayback();
          setStatus(
            runtimeResumed
              ? flushed
                ? "audio resumed"
                : "audio resumed; waiting for audio"
              : "audio resumed; runtime resume not confirmed",
          );
        } catch (error) {
          setStatus(error && error.message ? error.message : String(error));
        }
      }

      async function refreshAndReconnectRuntimeMonitor() {
        disconnectMonitor({
          resetAudio: true,
          status: "refreshing runtime",
          clearArmed: true,
          preventReconnect: true,
        });
        runtimeStartRequested = false;
        setRuntimeInlineState("", "");
        const stopped = await stopRuntimeForRecovery();
        if (stopped) {
          setStatus("refreshed; click Connect & Start audio");
        }
      }

      function parseJsonObject(value) {
        if (typeof value !== "string") {
          return value;
        }
        try {
          const parsed = JSON.parse(value);
          return parsed && typeof parsed === "object" && !Array.isArray(parsed)
            ? parsed
            : value;
        } catch (error) {
          return value;
        }
      }

      function parseJsonArray(value) {
        if (Array.isArray(value)) {
          return value;
        }
        if (value && typeof value === "object") {
          const nested = value.items || value.value || value.sequence || value.fixed_speaker_sequence;
          if (nested) {
            return parseJsonArray(nested);
          }
          const keys = Object.keys(value);
          if (keys.length > 0 && keys.every((key) => /^\d+$/.test(key))) {
            return keys
              .sort((left, right) => Number(left) - Number(right))
              .map((key) => value[key]);
          }
          return value;
        }
        if (typeof value !== "string") {
          return value;
        }
        const trimmed = value.trim();
        if (!trimmed) {
          return value;
        }
        try {
          const parsed = JSON.parse(trimmed);
          return Array.isArray(parsed) ? parsed : value;
        } catch (error) {
          if (!trimmed.includes(",") && !trimmed.includes("\n")) {
            return value;
          }
          return trimmed
            .replace(/\n/g, ",")
            .split(",")
            .map((item) => item.trim())
            .filter((item) => item.length > 0);
        }
      }

      function normalizeStartOptions(startOptions) {
        const normalized = parseJsonObject(startOptions);
        if (!normalized || typeof normalized !== "object" || Array.isArray(normalized)) {
          return {};
        }
        if ("fixed_speaker_sequence" in normalized) {
          normalized.fixed_speaker_sequence = parseJsonArray(
            normalized.fixed_speaker_sequence,
          );
        }
        return normalized;
      }

      function disconnectMonitor(options) {
        if (runtimeIsHumanClientMode()) cleanupHumanRecording();
        const nextOptions = Object.assign(
          {
            resetAudio: true,
            status: "closed",
            clearArmed: true,
            preventReconnect: true,
          },
          options || {},
        );
        manualDisconnect = Boolean(nextOptions.preventReconnect);
        clearReconnectTimer();
        if (nextOptions.clearArmed) {
          clearArmedMonitorForUrl(args.ws_url);
        }
        if (socket) {
          socket.close();
          socket = null;
        }
        if (nextOptions.resetAudio) {
          resetAudioPlayback();
        }
        setStatus(nextOptions.status);
      }

      function applyArgs(nextArgs) {
        const previousUrl = args.ws_url;
        args = Object.assign({}, args, nextArgs || {});
        updateGain();
        updateHumanInputVisibility();
        if (args.runtime_status_url) {
          startRuntimeInlineStatusPolling();
          refreshRuntimeInlineState();
        } else {
          stopRuntimeInlineStatusPolling();
          setRuntimeInlineState("", "");
        }
        if (previousUrl && previousUrl !== args.ws_url) {
          disconnectMonitor({
            clearArmed: true,
            preventReconnect: true,
          });
          clearArmedMonitorForUrl(previousUrl);
        }
        if (args.connect || isMonitorArmed()) {
          connectMonitor({ userGesture: false, allowPendingAudio: isMonitorArmed() });
        }
      }

      startButton.addEventListener("click", async () => {
        await startRuntimeWithAudio();
      });
      pauseButton.addEventListener("click", async () => {
        await pauseAudioPlayback();
      });
      resumeButton.addEventListener("click", async () => {
        await resumeAudioPlayback();
      });
      recoverButton.addEventListener("click", async () => {
        await refreshAndReconnectRuntimeMonitor();
      });
      humanMicrophoneSelect.addEventListener("change", async () => {
        const wasOn = humanMicrophoneIsOn();
        storeHumanMicrophoneDeviceId(selectedHumanMicrophoneDeviceId());
        if (wasOn) {
          stopHumanMicrophone("switching microphone");
          await ensureHumanMicrophoneEnabled();
        }
      });
      humanInputGainSlider.addEventListener("input", () => {
        setHumanInputGain(humanInputGainSlider.value);
      });
      humanAlwaysSensitivitySelect.addEventListener("change", () => {
        setHumanAlwaysSensitivity(humanAlwaysSensitivitySelect.value);
      });

      function captureHumanRecordPointer(event) {
        humanActivePointerId = event.pointerId;
        if (humanRecordButton.setPointerCapture) {
          try {
            humanRecordButton.setPointerCapture(event.pointerId);
          } catch (error) {
            // Pointer capture may fail if the browser already released this pointer.
          }
        }
      }

      function isActiveHumanRecordPointer(event) {
        return humanActivePointerId === null || event.pointerId === humanActivePointerId;
      }

      function releaseHumanRecordPointer(event) {
        const pointerId = humanActivePointerId;
        humanActivePointerId = null;
        if (
          pointerId !== null &&
          humanRecordButton.releasePointerCapture &&
          humanRecordButton.hasPointerCapture &&
          humanRecordButton.hasPointerCapture(pointerId)
        ) {
          try {
            humanRecordButton.releasePointerCapture(pointerId);
          } catch (error) {
            // The browser may have already released pointer capture.
          }
        }
      }

      async function requestHumanRecordingStop() {
        if (humanRecordingStarting) {
          humanStopAfterStart = true;
          return;
        }
        await stopHumanRecordingAndSubmit();
      }

      async function startAlwaysHumanRecording() {
        humanAlwaysRecordingEnabled = true;
        humanAlwaysVadInputAllowed = false;
        resetHumanAlwaysRestartState();
        resetHumanAlwaysBargeInDetection();
        resetHumanAlwaysBargeInControllerState();
        resetHumanAlwaysAutoStopDetection();
        resetHumanAlwaysMonitorPreRoll();
        resetHumanAlwaysPendingPreRoll();
        humanAlwaysRecordToggle.checked = true;
        updateHumanRecordButtonLabel();
        setHumanStatus("always armed; waiting for human input");
        const microphoneReady = await ensureHumanMicrophoneEnabled();
        if (!microphoneReady) {
          humanAlwaysRecordingEnabled = false;
          humanAlwaysRecordToggle.checked = false;
          updateHumanRecordButtonLabel();
          return;
        }
        void startAlwaysBargeInCaptureMonitor();
        if (args.runtime_status_url) {
          const status = await fetchRuntimeStatus();
          if (status) {
            updateRuntimeInlineStateFromStatus(status);
            await maybeResumeAlwaysHumanRecordingFromStatus(status);
          }
          return;
        }
        setHumanStatus("always armed; waiting for human input");
      }

      async function stopAlwaysHumanRecording() {
        const wasRecordingOrStarting = humanRecording || humanRecordingStarting;
        humanAlwaysRecordingEnabled = false;
        humanAlwaysVadInputAllowed = false;
        resetHumanAlwaysRestartState();
        resetHumanAlwaysBargeInDetection();
        resetHumanAlwaysBargeInControllerState();
        resetHumanAlwaysAutoStopDetection();
        resetHumanAlwaysMonitorPreRoll();
        resetHumanAlwaysPendingPreRoll();
        humanAlwaysRecordToggle.checked = false;
        updateHumanRecordButtonLabel();
        await requestHumanRecordingStop();
        if (!wasRecordingOrStarting && humanInputStream) {
          stopHumanMicrophone("microphone off");
        }
      }

      humanAlwaysRecordToggle.addEventListener("change", async () => {
        if (humanAlwaysRecordToggle.checked) {
          await startAlwaysHumanRecording();
        } else {
          await stopAlwaysHumanRecording();
        }
      });

      humanRecordButton.addEventListener("pointerdown", async (event) => {
        event.preventDefault();
        if (humanAlwaysRecordingEnabled) {
          return;
        }
        if (humanActivePointerId !== null) {
          return;
        }
        captureHumanRecordPointer(event);
        await startHumanRecording({ allowPlaybackBargeIn: true });
        if (!humanRecording && !humanRecordingStarting) {
          releaseHumanRecordPointer(event);
        }
      });
      humanRecordButton.addEventListener("pointerup", async (event) => {
        if (humanAlwaysRecordingEnabled) {
          event.preventDefault();
          return;
        }
        if (!isActiveHumanRecordPointer(event)) {
          return;
        }
        event.preventDefault();
        releaseHumanRecordPointer(event);
        await requestHumanRecordingStop();
      });
      humanRecordButton.addEventListener("pointercancel", async (event) => {
        if (humanAlwaysRecordingEnabled) {
          return;
        }
        if (!isActiveHumanRecordPointer(event)) {
          return;
        }
        releaseHumanRecordPointer(event);
        await requestHumanRecordingStop();
      });
      humanRecordButton.addEventListener("lostpointercapture", async (event) => {
        if (humanAlwaysRecordingEnabled) {
          return;
        }
        if (humanActivePointerId !== event.pointerId) {
          return;
        }
        humanActivePointerId = null;
        await requestHumanRecordingStop();
      });
      if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
        navigator.mediaDevices.addEventListener("devicechange", () => {
          void refreshHumanMicrophones();
        });
      }
      window.addEventListener("pagehide", () => {
        cleanupHumanRecording();
        stopHumanMicrophone("closed");
        disconnectMonitor({
          resetAudio: true,
          status: "closed",
          clearArmed: false,
          preventReconnect: true,
        });
        if (monitorChannel) {
          monitorChannel.close();
        }
      });

      window.addEventListener("message", (event) => {
        const message = event.data || {};
        if (message.type !== "streamlit:render") {
          return;
        }
        streamlitRenderReceived = true;
        applyArgs(message.args || {});
      });

      if (isMonitorArmed()) {
        connectMonitor({ userGesture: false, allowPendingAudio: true });
      }
      setHumanInputGain(storedHumanInputGain(), { persist: false });
      setHumanAlwaysSensitivity(storedHumanAlwaysSensitivity(), { persist: false });
      updateHumanInputVisibility();
      if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", scheduleInitialStreamlitNotifications, {
          once: true,
        });
      } else {
        scheduleInitialStreamlitNotifications();
      }
      window.addEventListener("load", notifyStreamlitReady, { once: true });
    </script>
  </body>
</html>
