<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: transparent;
        color: inherit;
      }
      .monitor {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 0 2px;
      }
      .bar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        font-size: 13px;
      }
      .title {
        font-weight: 700;
      }
      .status {
        opacity: 0.72;
        white-space: nowrap;
      }
      .meta {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 10px;
        font-size: 13px;
      }
      .meta div {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .runtime-inline-state {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        color: rgba(15, 118, 110, 0.98);
        font-size: 13px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .runtime-inline-state[hidden] {
        display: none;
      }
      .runtime-inline-state.warning {
        color: rgba(217, 119, 6, 0.98);
      }
      .human-input {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 13px;
      }
      .human-input[hidden] {
        display: none;
      }
      .human-talk-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        min-width: min(100%, 360px);
        flex: 1 1 360px;
      }
      .human-always-record-toggle {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 34px;
        color: rgba(248, 250, 252, 0.9);
        font-size: 13px;
        font-weight: 650;
        user-select: none;
      }
      .human-always-record-toggle input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      .human-always-record-track {
        position: relative;
        width: 34px;
        height: 20px;
        border: 1px solid rgba(148, 163, 184, 0.7);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        transition:
          background 140ms ease,
          border-color 140ms ease;
      }
      .human-always-record-track::before {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: rgba(248, 250, 252, 0.88);
        content: "";
        transition: transform 140ms ease;
      }
      .human-always-record-toggle input:checked ~ .human-always-record-track {
        border-color: rgba(20, 184, 166, 0.95);
        background: rgba(15, 118, 110, 0.72);
      }
      .human-always-record-toggle input:checked ~ .human-always-record-track::before {
        transform: translateX(14px);
      }
      .human-always-record-toggle input:focus-visible ~ .human-always-record-track {
        outline: 2px solid rgba(96, 165, 250, 0.9);
        outline-offset: 2px;
      }
      .human-always-record-toggle input:disabled ~ .human-always-record-track,
      .human-always-record-toggle input:disabled ~ .human-always-record-text {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .human-always-sensitivity {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 34px;
        color: rgba(248, 250, 252, 0.9);
        font-size: 13px;
        white-space: nowrap;
      }
      .human-always-sensitivity-select {
        min-width: 92px;
      }
      .human-always-sensitivity-select:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .human-microphone-row {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
        flex: 1 1 260px;
      }
      #human-record {
        touch-action: none;
      }
      #human-record.recording {
        background: rgba(185, 28, 28, 0.14);
        border-color: rgba(185, 28, 28, 0.58);
      }
      .human-status {
        opacity: 0.72;
        overflow-wrap: anywhere;
      }
      .human-microphone {
        min-width: min(100%, 220px);
        max-width: 320px;
        flex: 1 1 220px;
      }
      .human-input-level {
        --human-input-level-width: 0%;
        --human-input-level-color: rgba(100, 116, 139, 0.72);
        display: inline-flex;
        align-items: center;
        width: 120px;
        min-height: 32px;
      }
      .human-input-level-track {
        width: 100%;
        height: 10px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.55);
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.72);
      }
      .human-input-level-fill {
        width: var(--human-input-level-width);
        height: 100%;
        background: var(--human-input-level-color);
        transition:
          width 80ms linear,
          background 120ms ease;
      }
      .human-input-gain {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        color: rgba(248, 250, 252, 0.9);
        font-size: 13px;
        white-space: nowrap;
      }
      .human-input-gain-slider {
        width: 112px;
        accent-color: #0f766e;
      }
      .human-input-gain-slider:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .human-input-gain-value {
        min-width: 44px;
        color: rgba(248, 250, 252, 0.82);
        font-variant-numeric: tabular-nums;
      }
      .human-status-row {
        flex: 0 0 100%;
        min-height: 18px;
        display: flex;
        align-items: center;
      }
      .warmup-indicator {
        display: none;
        align-items: center;
        gap: 8px;
        min-height: 24px;
        margin-top: 8px;
        color: rgba(15, 118, 110, 0.98);
        font-size: 13px;
        font-weight: 700;
      }
      .warmup-indicator.active {
        display: flex;
      }
      .warmup-spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(15, 118, 110, 0.25);
        border-top-color: rgba(15, 118, 110, 0.98);
        border-radius: 50%;
        animation: warmupSpin 850ms linear infinite;
        flex: 0 0 auto;
      }
      .warmup-text {
        animation: warmupPulse 1200ms ease-in-out infinite;
      }
      @keyframes warmupSpin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes warmupPulse {
        0%,
        100% {
          opacity: 0.58;
        }
        50% {
          opacity: 1;
        }
      }
      button {
        appearance: none;
        border: 1px solid rgba(128, 128, 128, 0.45);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        padding: 6px 10px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      select {
        color-scheme: dark;
        min-height: 32px;
        border: 1px solid rgba(128, 128, 128, 0.45);
        border-radius: 6px;
        padding: 5px 8px;
        color: #f8fafc;
        background: #0b0f14;
        font: inherit;
        font-size: 13px;
      }
      select option {
        color: #f8fafc;
        background: #0b0f14;
      }
      select option:checked {
        color: #f8fafc;
        background: #1f2937;
      }
      select:disabled {
        color: #94a3b8;
        background: #111827;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .primary {
        background: rgba(15, 118, 110, 0.14);
        border-color: rgba(15, 118, 110, 0.55);
      }
      #start-runtime {
        width: min(100%, 430px);
        min-height: 40px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 700;
      }
      .timeline {
        margin-top: 12px;
        border-top: 1px solid rgba(148, 163, 184, 0.38);
        padding-top: 10px;
      }
      .timeline-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .timeline-title {
        color: rgba(15, 23, 42, 0.92);
        font-weight: 700;
      }
      .timeline-clock {
        color: rgba(71, 85, 105, 0.95);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .timeline-lanes {
        display: grid;
        gap: 10px;
        max-height: 280px;
        overflow-y: auto;
        padding-right: 2px;
      }
      .timeline-item {
        display: grid;
        grid-template-columns: minmax(96px, 144px) minmax(0, 1fr);
        gap: 12px;
        border-left: 3px solid rgba(15, 118, 110, 0.7);
        background: rgba(248, 250, 252, 0.78);
        padding: 10px 12px;
        line-height: 1.35;
      }
      .timeline-item.pending {
        opacity: 0.58;
      }
      .timeline-lane {
        min-width: 0;
        color: rgba(51, 65, 85, 0.95);
        font-size: 18px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .timeline-text {
        min-width: 0;
        color: rgba(15, 23, 42, 0.95);
        font-size: 24px;
        font-weight: 650;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .timeline-empty {
        color: rgba(71, 85, 105, 0.95);
        font-size: 12px;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        .warmup-indicator {
          color: rgba(45, 212, 191, 0.96);
        }
        .warmup-spinner {
          border-color: rgba(45, 212, 191, 0.22);
          border-top-color: rgba(45, 212, 191, 0.96);
        }
        .runtime-inline-state {
          color: rgba(45, 212, 191, 0.96);
        }
        .runtime-inline-state.warning {
          color: rgba(251, 191, 36, 0.98);
        }
        .timeline-title,
        .timeline-text {
          color: rgba(248, 250, 252, 0.94);
        }
        .timeline-item {
          background: rgba(15, 23, 42, 0.66);
        }
        .timeline-lane,
        .timeline-clock,
        .timeline-empty {
          color: rgba(203, 213, 225, 0.9);
        }
      }
    </style>
  </head>
  <body>
    <div class="monitor">
      <div class="bar">
        <div class="title">v1.2 audio monitor</div>
        <div class="status" id="status">idle</div>
      </div>
      <div class="meta">
        <div>session: <span id="session">-</span></div>
        <div>turn: <span id="turn">-</span></div>
        <div>speaker: <span id="speaker">-</span></div>
        <div>chunks: <span id="chunks">0 / 0</span></div>
      </div>
      <div class="controls">
        <button id="start-runtime" class="primary" type="button">Connect & Start audio</button>
        <button id="pause-runtime" type="button">Pause</button>
        <button id="resume-runtime" type="button">Resume</button>
        <button id="recover-runtime" type="button">Refresh & Reconnect</button>
        <span class="runtime-inline-state" id="runtime-inline-state" aria-live="polite" hidden></span>
      </div>
      <div class="human-input" id="human-input" hidden>
        <div class="human-talk-row">
          <button id="human-record" type="button">Hold to talk</button>
          <label class="human-always-record-toggle" title="Latch Hold to talk on">
            <input
              id="human-always-record"
              type="checkbox"
              role="switch"
              aria-label="always Hold to talk"
            />
            <span class="human-always-record-text">Always</span>
            <span class="human-always-record-track" aria-hidden="true"></span>
          </label>
          <label class="human-always-sensitivity" title="Noise rejection for Always mode">
            <span>Always sens</span>
            <select
              class="human-always-sensitivity-select"
              id="human-always-sensitivity"
              aria-label="Always sensitivity"
            >
              <option value="low">Low</option>
              <option value="standard" selected>Standard</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>
        <div class="human-microphone-row">
          <div
            class="human-input-level"
            id="human-input-level"
            role="meter"
            aria-label="Microphone input level"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            title="Microphone input level"
          >
            <div class="human-input-level-track" aria-hidden="true">
              <div class="human-input-level-fill" id="human-input-level-fill"></div>
            </div>
          </div>
          <label class="human-input-gain" title="Software gain applied before STT">
            <span>Mic gain</span>
            <input
              class="human-input-gain-slider"
              id="human-input-gain"
              type="range"
              min="0.5"
              max="4"
              step="0.25"
              value="1"
              aria-label="Microphone input gain"
            />
            <span class="human-input-gain-value" id="human-input-gain-value">1.00x</span>
          </label>
          <select class="human-microphone" id="human-microphone" aria-label="Microphone">
            <option value="">Default microphone</option>
          </select>
        </div>
        <div class="human-status-row">
          <span class="human-status" id="human-status">push-to-talk ready</span>
        </div>
      </div>
      <div class="warmup-indicator" id="warmup-indicator" aria-live="polite">
        <span class="warmup-spinner" aria-hidden="true"></span>
        <span class="warmup-text" id="warmup-text">先行生成中</span>
      </div>
      <div class="timeline">
        <div class="timeline-head">
          <div class="timeline-title">Live conversation timeline</div>
          <div class="timeline-clock" id="timeline-clock">--:--</div>
        </div>
        <div class="timeline-lanes" id="timeline-lanes">
          <div class="timeline-empty">Waiting for scheduled speech.</div>
        </div>
      </div>
    </div>
    <script>
      const statusEl = document.getElementById("status");
      const sessionEl = document.getElementById("session");
      const turnEl = document.getElementById("turn");
      const speakerEl = document.getElementById("speaker");
      const chunksEl = document.getElementById("chunks");
      const startButton = document.getElementById("start-runtime");
      const pauseButton = document.getElementById("pause-runtime");

        "human-always-sensitivity",
      );
      const humanRecordButton = document.getElementById("human-record");
      const humanStatusEl = document.getElementById("human-status");
      const timelineLanesEl = document.getElementById("timeline-lanes");
      const timelineClockEl = document.getElementById("timeline-clock");
      const warmupIndicatorEl = document.getElementById("warmup-indicator");
      const warmupTextEl = document.getElementById("warmup-text");

          payload.turn_id = metadata.turn_id;
        }
        ["item_id", "response_id", "content_index"].forEach((key) => {
          if (metadata[key] !== undefined && metadata[key] !== null) {
            payload[key] = metadata[key];
          }
        });
        return payload;
      }

      function stopMainPlaybackSegments(exceptKey) {
        const interruptedSegments = [];
        Array.from(mainPlaybackSegments.entries()).forEach(([key, segments]) => {
          if (key === exceptKey) {
            return;
          }
          Array.from(segments).forEach((segment) => {
            interruptedSegments.push(segment);
            interruptedPlaybackKeys.add(key);
            removeMainPlaybackSegment(segment);
            activeSources.delete(segment.source);
            try {
              segment.source.stop();
            } catch (error) {
              // Source may already have ended.
            }
          });
        });
        if (interruptedSegments.length === 0) {
          return null;
        }
        clearAllPcmRemainders();
        interruptedSegments.sort((left, right) => left.startAt - right.startAt);
        if (audioContext) {
          playbackLanes[PLAYBACK_LANE_MAIN].scheduledTime = audioContext.currentTime;
        }
        renderTimeline({ forceScrollToBottom: true });
        return interruptedSegments[0];
      }

      function stopMainPlaybackSegmentsForKey(key) {
        if (!key || !mainPlaybackSegments.has(key)) {
          return false;
        }
        Array.from(mainPlaybackSegments.get(key)).forEach((segment) => {
          interruptedPlaybackKeys.add(key);
          removeMainPlaybackSegment(segment);
          activeSources.delete(segment.source);
          try {
            segment.source.stop();
          } catch (error) {
            // Source may already have ended.
          }
        });
        if (audioContext) {
          playbackLanes[PLAYBACK_LANE_MAIN].scheduledTime = audioContext.currentTime;
        }
        return true;
      }

      function removeTimelineItemByKey(key) {
        if (!key) {
          return false;
        }
        const removed = timelineItems.delete(key);
        playbackMetadataByKey.delete(key);
        completedPlaybackKeys.delete(key);
        turnEndPlaybackKeys.delete(key);
        return removed;
      }

      function shouldDropInterruptedPlayback(metadata) {
        return interruptedPlaybackKeys.has(playbackKeyFromMetadata(metadata || {}));
      }

      async function interruptActiveMainPlayback(metadata, options = {}) {
        if (!audioContext) {
          return false;
        }
        const nextKey = playbackKeyFromMetadata(metadata || {});
        const interruptedSegment = stopMainPlaybackSegments(nextKey);
        if (!interruptedSegment) {
          return false;
        }
        if (!args.runtime_interrupt_url) {
          setStatus("runtime interrupt failed: missing url");
          return true;
        }
        return postRuntimeControl(args.runtime_interrupt_url,
          "runtime interrupt failed",
          interruptPayloadForSegment(interruptedSegment, options),
        );
      }

      function timelineItemForMetadata(metadata) {
        const safeMetadata = metadata || {};
        const key = timelineKeyFromMetadata(safeMetadata);
        let item = timelineItems.get(key);
        const visibleWithoutPlayback = isHumanTranscriptMetadata(safeMetadata);
        if (!item) {
          item = {
            key,
            sessionId: safeMetadata.session_id || "",
            turnId: safeMetadata.turn_id,
            speakerId: safeMetadata.speaker_id || safeMetadata.speaker || "",
            displayName:
              safeMetadata.display_name ||
              safeMetadata.speaker_id ||
              safeMetadata.speaker ||
              "speaker",
            role: safeMetadata.role || "",
            text: "",
            finalText: "",
            startAt: null,
            endAt: null,
            audioChunks: 0,
            status: "pending",
            visibleWithoutPlayback,
            createdOrder: timelineItems.size,
          };
          timelineItems.set(key, item);
        } else {
          if (item.turnId == null && safeMetadata.turn_id != null) {
            item.turnId = safeMetadata.turn_id;
          }
          item.displayName =
            safeMetadata.display_name ||
            item.displayName ||
            safeMetadata.speaker_id ||
            safeMetadata.speaker ||
            "speaker";
          item.role = safeMetadata.role || item.role || "";
          item.visibleWithoutPlayback =
            item.visibleWithoutPlayback || visibleWithoutPlayback;
        }
        return item;
      }

      function isHumanTranscriptMetadata(metadata) {
        const safeMetadata = metadata || {};
        return (
          safeMetadata.transcript_type === "human_final" ||
          safeMetadata.text_source === "human_mic_stt" ||
          safeMetadata.text_source === "human_stt" ||
          safeMetadata.text_source === "human_streaming_stt"
        );
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatClock(seconds) {
        const totalSeconds = Math.max(0, Math.floor(Number(seconds) || 0));
        const minutes = Math.floor(totalSeconds / 60);
        const remainingSeconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;
      }

      function timelineItemIsVisible(item, context) {
        if (item.visibleWithoutPlayback) {
          return true;
        }
        return (
          item.startAt !== null &&
          context &&
          context.currentTime + PLAYBACK_LEAD_SECONDS >= item.startAt
        );
      }

      function startTimelineTimer() {
        if (timelineTimer !== null) {
          return;
        }
        if (!timelineShouldAutoScroll()) {
          return;
        }
        timelineTimer = window.setInterval(renderTimeline, 100);
      }

      function stopTimelineTimer() {
        if (timelineTimer === null) {
          return;
        }
        window.clearInterval(timelineTimer);
        timelineTimer = null;
      }

      function timelineShouldAutoScroll() {
        return Boolean(
          audioContext &&
            audioContext.state === "running" &&
            !audioPlaybackPaused &&
            activeSources.size > 0
        );
      }

      function refreshTimelineTimer() {
        if (timelineShouldAutoScroll()) {
          startTimelineTimer();
        } else {
          stopTimelineTimer();
        }
      }

      function keepTimelineScrolledToBottom() {
        window.requestAnimationFrame(() => {
          timelineLanesEl.scrollTop = timelineLanesEl.scrollHeight;
        });
      }

      function restoreTimelineScrollPosition(scrollTop) {
        window.requestAnimationFrame(() => {
          timelineLanesEl.scrollTop = scrollTop;
        });
      }

      function timelineTurnSortValue(item) {
        const value = Number(item && item.turnId);
        return Number.isFinite(value) ? value : Number.POSITIVE_INFINITY;
      }

      function compareTimelineItems(left, right) {
        const leftTurn = timelineTurnSortValue(left);
        const rightTurn = timelineTurnSortValue(right);
        if (leftTurn !== rightTurn) {
          return leftTurn - rightTurn;
        }
        const leftStart = left.startAt == null ? Number.POSITIVE_INFINITY : left.startAt;
        const rightStart = right.startAt == null ? Number.POSITIVE_INFINITY : right.startAt;
        return leftStart - rightStart || left.createdOrder - right.createdOrder;
      }

      function renderTimeline(options) {
        const renderOptions = Object.assign({ forceScrollToBottom: false }, options || {});
        const context = audioContext;
        const previousScrollTop = timelineLanesEl.scrollTop;
        const shouldAutoScroll =
          Boolean(renderOptions.forceScrollToBottom) || timelineShouldAutoScroll();
        const visibleItems = Array.from(timelineItems.values())
          .filter((item) => timelineItemIsVisible(item, context))
          .sort(compareTimelineItems)
          .slice(-12);
        timelineClockEl.textContent = context ? formatClock(context.currentTime) : "--:--";
        if (visibleItems.length === 0) {
          timelineLanesEl.innerHTML =
            '<div class="timeline-empty">Waiting for scheduled speech.</div>';
          if (shouldAutoScroll) {
            keepTimelineScrolledToBottom();
          } else {
            restoreTimelineScrollPosition(previousScrollTop);
          }
          setFrameHeight();
          return;
        }
        timelineLanesEl.innerHTML = visibleItems
          .map((item) => {
            const statusClass =
              item.status === "final" || item.status === "interrupted"
                ? "final"
                : "pending";
            const text = item.finalText || item.text;
            return `
              <div class="timeline-item ${statusClass}">
                <div class="timeline-lane">${escapeHtml(item.displayName)}</div>
                <div class="timeline-text">${escapeHtml(text)}</div>
              </div>
            `;
          })
          .join("");
        if (shouldAutoScroll) {
          keepTimelineScrolledToBottom();
        } else {
          restoreTimelineScrollPosition(previousScrollTop);
        }
        setFrameHeight();
      }

      function handleTranscriptMessage(message, final) {
        const item = timelineItemForMetadata(message.metadata || {});
        const text = String(message.text || "");
        if (final) {
          item.finalText = text;
          item.text = text;
          item.status = "final";
          if (item.visibleWithoutPlayback && item.startAt === null && audioContext) {
            item.startAt = audioContext.currentTime;
          }
        } else {
          item.text += text;
          item.status = item.startAt === null ? "pending" : "active";
        }
        renderTimeline({ forceScrollToBottom: item.visibleWithoutPlayback });
        // Input socket completion owns recording state. Monitor transcripts may
        // arrive after the next recording has already started.
      }

      function handleTranscriptInterruptedMessage(message) {
        const metadata = message.metadata || {};
        const key = playbackKeyFromMetadata(metadata);
        if (key) {
          interruptedPlaybackKeys.add(key);
        }
        clearPcmRemainderForMetadata(metadata);
        const item = timelineItems.get(key);
        if (item) {
          const interruptedText = String(message.text || "");
          if (interruptedText) {
            item.finalText = interruptedText;
            item.text = interruptedText;
          }
          item.status = "interrupted";
          renderTimeline({ forceScrollToBottom: true });
        }
        setStatus("interrupted transcript retained");
        return true;
      }

      function handleTranscriptInvalidatedMessage(message) {
        const metadata = message.metadata || {};
        const key = playbackKeyFromMetadata(metadata);
        if (key) {
          interruptedPlaybackKeys.add(key);
          stopMainPlaybackSegmentsForKey(key);
          removeTimelineItemByKey(key);
        }
        clearPcmRemainderForMetadata(metadata);
        renderTimeline({ forceScrollToBottom: true });
        setStatus("invalidated stale transcript");
        return true;
      }

      function updateTimelineAudio(metadata, playback) {
        if (!metadata || !playback) {
          return;
        }
        const item = timelineItemForMetadata(metadata);
        if (item.startAt === null) {
          item.startAt = playback.startAt;
        }
        item.endAt = Math.max(item.endAt || playback.endAt, playback.endAt);
        item.audioChunks += playback.chunkCount || 1;
        if (item.status === "pending") {
          item.status = "active";
        }
        startTimelineTimer();
        renderTimeline();
      }

      function pcmBytesFromBase64(message) {
        const binary = window.atob(message.pcm_base64 || "");
        const nextBytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          nextBytes[index] = binary.charCodeAt(index);
        }
        return nextBytes;
      }

      function decodePcmBytes(nextBytes, metadata, lane) {
        const safeMetadata = metadata || {};
        const channels = Math.max(1, Number(safeMetadata.channels || 1));
        const sampleWidthBits = Number(safeMetadata.sample_width_bits || 16);
        if (sampleWidthBits !== 16) {
          throw new Error(`unsupported PCM width: ${sampleWidthBits}`);
        }
        const bytesPerFrame = 2 * channels;
        const bytes = new Uint8Array(lane.pcmRemainder.byteLength + nextBytes.byteLength);
        bytes.set(lane.pcmRemainder, 0);
        bytes.set(nextBytes, lane.pcmRemainder.byteLength);
        const completeByteLength = bytes.byteLength - (bytes.byteLength % bytesPerFrame);
        lane.pcmRemainder = bytes.slice(completeByteLength);
        if (completeByteLength <= 0) {
          return {
            channels,
            sampleRate: Number(safeMetadata.sample_rate || 24000),
            frames: 0,
            channelData: Array.from({ length: channels }, () => new Float32Array(0)),
          };
        }
        const completeBytes = bytes.slice(0, completeByteLength);
        const sampleCount = Math.floor(completeBytes.byteLength / 2);
        const frames = Math.floor(sampleCount / channels);
        const channelData = Array.from({ length: channels }, () => new Float32Array(frames));
        const view = new DataView(completeBytes.buffer);
        for (let frame = 0; frame < frames; frame += 1) {
          for (let channel = 0; channel < channels; channel += 1) {
            const sampleIndex = (frame * channels + channel) * 2;
            channelData[channel][frame] = view.getInt16(sampleIndex, true) / 32768;
          }
        }
        return {
          channels,
          sampleRate: Number(safeMetadata.sample_rate || 24000),
          frames,
          channelData,
        };
      }

      function clearPlaybackBatch(lane) {
        lane.pendingPcmChunks = [];
        lane.pendingPcmByteLength = 0;
        lane.pendingPcmMetadata = null;
        lane.pendingPcmPlaybackKey = "";
        lane.pendingPcmChunkCount = 0;
      }

      function playbackBatchTargetByteLength(metadata) {
        const safeMetadata = metadata || {};
        const channels = Math.max(1, Number(safeMetadata.channels || 1));
        const sampleRate = Math.max(1, Number(safeMetadata.sample_rate || 24000));
        return Math.max(
          2 * channels,
          Math.floor(sampleRate * PLAYBACK_BATCH_TARGET_SECONDS) * 2 * channels,
        );
      }

      function appendPcmChunkToPlaybackBatch(message) {
        if (!canScheduleAudio()) {
          return false;
        }
        const lane = playbackLaneForMetadata(message.metadata);
        const playbackKey = playbackKeyFromMetadata(message.metadata || {});
        if (
          lane.pendingPcmByteLength > 0 &&
          lane.pendingPcmPlaybackKey &&
          lane.pendingPcmPlaybackKey !== playbackKey
        ) {
          const previousPlayback = flushPlaybackBatch(lane);
          if (previousPlayback) {
            updateTimelineAudio(previousPlayback.metadata, previousPlayback);
          }
        }
        const nextBytes = pcmBytesFromBase64(message);
        lane.pendingPcmChunks.push(nextBytes);
        lane.pendingPcmByteLength += nextBytes.byteLength;
        lane.pendingPcmMetadata = Object.assign({}, message.metadata || {});
        lane.pendingPcmPlaybackKey = playbackKey;
        lane.pendingPcmChunkCount += 1;
        if (
          lane.pendingPcmByteLength >=
          playbackBatchTargetByteLength(message.metadata || {})
        ) {
          return flushPlaybackBatch(lane);
        }
        return {
          queued: true,
          startAt: lane.scheduledTime,
          endAt: lane.scheduledTime,
          duration: 0,
          source: null,
          metadata: message.metadata || {},
          key: playbackKey,
        };
      }

      function flushPlaybackBatch(lane) {
        if (!canScheduleAudio() || lane.pendingPcmByteLength <= 0) {
          return null;
        }
        const metadata = lane.pendingPcmMetadata || {};
        const playbackKey = lane.pendingPcmPlaybackKey || playbackKeyFromMetadata(metadata);
        const chunkCount = lane.pendingPcmChunkCount;
        const bytes = new Uint8Array(lane.pendingPcmByteLength);
        let offset = 0;
        lane.pendingPcmChunks.forEach((chunk) => {
          bytes.set(chunk, offset);
          offset += chunk.byteLength;
        });
        clearPlaybackBatch(lane);
        const decoded = decodePcmBytes(bytes, metadata, lane);
        return scheduleDecodedPcmBuffer({
          decoded,
          metadata,
          playbackKey,
          chunkCount,
          lane,
        });
      }

      function scheduleDecodedPcmBuffer({
        decoded,
        metadata,
        playbackKey,
        chunkCount,
        lane,
      }) {
        const context = audioContext;
        if (decoded.frames <= 0) {
          return {
            startAt: lane.scheduledTime,
            endAt: lane.scheduledTime,
            duration: 0,
            source: null,
            metadata,
            key: playbackKey,
            chunkCount,
          };
        }
        const buffer = context.createBuffer(
          decoded.channels,
          decoded.frames,
          decoded.sampleRate,
        );
        decoded.channelData.forEach((values, channel) => {
          buffer.copyToChannel(values, channel);
        });
        const source = context.createBufferSource();
        source.buffer = buffer;
        source.connect(gainNode);
        activeSources.add(source);
        refreshRuntimeInlineState();
        source.addEventListener("ended", () => {
          activeSources.delete(source);
          refreshTimelineTimer();
          refreshRuntimeInlineState();
          renderTimeline();
        });
        const interTurnGapSeconds =
          lane.lastPlaybackKey && lane.lastPlaybackKey !== playbackKey
            ? playbackInterTurnGapSeconds()
            : 0;
        const startAt = Math.max(
          context.currentTime + PLAYBACK_LEAD_SECONDS + interTurnGapSeconds,
          lane.scheduledTime + interTurnGapSeconds,
        );
        source.start(startAt);
        lane.scheduledTime = startAt + buffer.duration;
        lane.lastPlaybackKey = playbackKey;
        const playback = {
          startAt,
          endAt: lane.scheduledTime,
          duration: buffer.duration,
          source,
          metadata,
          key: playbackKey,
          chunkCount,
        };
        trackMainPlaybackSegment(metadata, playback);
        return playback;
      }

      function updateMetadata(metadata, options = {}) {
        if (!metadata) {
          return;
        }
        sessionEl.textContent = metadata.session_id || "-";
        turnEl.textContent = metadata.turn_id == null ? "-" : String(metadata.turn_id);
        speakerEl.textContent = metadata.display_name || metadata.speaker || "-";
        syncRuntimeInlineStateFromMonitorMetadata(metadata);
        if (options.countChunk && metadata.speaker) {
          chunkCounts[metadata.speaker] = (chunkCounts[metadata.speaker] || 0) + 1;
          chunksEl.textContent = Object.entries(chunkCounts)
            .map(([speaker, count]) => `${speaker}:${count}`)
            .join(" / ");
        }
      }

      function syncRuntimeInlineStateFromMonitorMetadata(metadata) {
        const speaker = String(
          (metadata || {}).speaker_id || (metadata || {}).speaker || "",
        );
        if (!speaker || speaker === humanSpeakerId() ||
            ((metadata || {}).session_id && (latestRuntimeStatus || {}).session_id &&
             metadata.session_id !== latestRuntimeStatus.session_id)) {
          return;
        }
        latestRuntimeStatus = Object.assign({}, latestRuntimeStatus || {}, {
          phase: String((latestRuntimeStatus || {}).phase || "running"),
          current_speaker: speaker,
          active_speaker_id: speaker,
          awaiting_human_input: false,
          pending_human_turn_allowed: false,
          human_input_state: null,
        });
        setRuntimeInlineState("", "");
      }

      function handleAudioChunkMessage(message) {
        if (audioPlaybackPaused) {
          queuePausedPlaybackMessage(message);
          return false;
        }
        if (shouldDropInterruptedPlayback(message.metadata)) {
          clearPcmRemainderForMetadata(message.metadata);
          setStatus("dropping interrupted audio");
          return true;
        }
        updateMetadata(message.metadata, { countChunk: true });
        const playback = appendPcmChunkToPlaybackBatch(message);
        if (!playback) {
          setStatus("connected; click Connect & Start audio to hear audio");
          return false;
        }
        if (!playback.queued) {
          updateTimelineAudio(message.metadata, playback);
        }
        setStatus(
          audioContext && audioContext.state === "suspended"
            ? "audio paused"
            : "audio_context_running",
        );
        return true;
      }

      function handleTurnEndMessage(message) {
        if (audioPlaybackPaused) {
          queuePausedPlaybackMessage(message);
          return false;
        }
        updateMetadata(message.metadata);
        const playbackKey = playbackKeyFromMetadata(message.metadata || {});
        const wasInterrupted = interruptedPlaybackKeys.has(playbackKey);
        if (wasInterrupted) {
          clearPcmRemainderForMetadata(message.metadata);
        } else {
          const lane = playbackLaneForMetadata(message.metadata);
          const playback = flushPlaybackBatch(lane);
          if (playback) {
            updateTimelineAudio(playback.metadata || message.metadata, playback);
          }
          clearPcmRemainderForMetadata(message.metadata);
          playbackMetadataByKey.set(
            playbackKey,
            Object.assign({}, message.metadata || {}),
          );
          turnEndPlaybackKeys.add(playbackKey);
          emitPlaybackCompletedIfReady(playbackKey);
        }
        interruptedPlaybackKeys.delete(playbackKey);
        setStatus("turn end");
        return true;
      }

      function handlePlaybackMessage(message) {
        if (message.type === "audio_chunk") {
          return handleAudioChunkMessage(message);
        }
        if (message.type === "turn_end") {
          return handleTurnEndMessage(message);
        }
        return true;
      }

      function flushWarmupPlaybackBuffer(reason) {
        const pendingMessages = warmupBufferedMessages;
        if (!warmupActive && pendingMessages.length === 0) {
          return false;
        }
        clearWarmupTimer();
        warmupActive = false;
        warmupStartedAt = 0;
        warmupBufferedMessages = [];
        warmupCompletedTurnKeys.clear();
        updateWarmupIndicator();
        if (pendingMessages.length === 0) {
          setStatus("runtime running; waiting for audio");
          return false;
        }
        if (audioPlaybackPaused || (audioContext && audioContext.state === "suspended")) {
          pausedPlaybackMessages = pendingMessages.concat(pausedPlaybackMessages);
          setStatus("audio paused");
          return true;
        }
        if (audioContext) {
          resetPlaybackLaneSchedules(audioContext.currentTime);
        }
        for (let index = 0; index < pendingMessages.length; index += 1) {
          if (!handlePlaybackMessage(pendingMessages[index])) {
            pausedPlaybackMessages = pendingMessages.slice(index);
            return false;
          }
        }
        refreshTimelineTimer();
        setStatus(
          reason === "timeout"
            ? "先行生成タイムアウト; playback started"
            : "audio_context_running",
        );
        return true;
      }

      function updateHumanInputVisibility() {
        const enabled = runtimeHasHumanInput();
        humanInputEl.hidden = !enabled;
        humanRecordButton.disabled = !enabled;
        humanAlwaysRecordToggle.disabled = !enabled;
        humanAlwaysSensitivitySelect.disabled = !enabled;
        humanMicrophoneSelect.disabled = !enabled;
        humanInputGainSlider.disabled = !enabled;
        if (!enabled) {
          updateHumanInputLevel(0, 0);
          humanAlwaysRecordingEnabled = false;
          humanAlwaysVadInputAllowed = false;
          resetHumanAlwaysRestartState();
          resetHumanAlwaysBargeInControllerState();
          resetHumanAlwaysPendingPreRoll();
          humanAlwaysRecordToggle.checked = false;
          updateHumanRecordButtonLabel();
          if (humanRecording || humanRecordingStarting) {
            void requestHumanRecordingStop();
          } else {
            stopHumanMicrophone("push-to-talk disabled");
          }
          humanStatusEl.textContent = "push-to-talk disabled";
        } else {
          void refreshHumanMicrophones();
          void ensureHumanMicrophoneEnabled();
          updateHumanRecordButtonLabel();
        }
        setFrameHeight();
      }

      function setHumanStatus(value, options = {}) {
        if (options.title !== undefined) {
          humanStatusEl.title = options.title;
        } else if (options.clearTitle !== false) {
          humanStatusEl.removeAttribute("title");
        }
        if (humanStatusEl.textContent !== value) {
          humanStatusEl.textContent = value;
        }
        if (options.resize !== false) {
          setFrameHeight();
        }
      }

      function updateHumanInputLevel(peak, rms) {
        const safePeak = Math.max(0, Number(peak) || 0);
        const safeRms = Math.max(0, Number(rms) || 0);
        const settings = humanAlwaysSensitivitySettings();
        const peakRatio = settings.peak > 0 ? safePeak / settings.peak : 0;
        const rmsRatio = settings.rms > 0 ? safeRms / settings.rms : 0;
        const peakFloorRatio =
          settings.peakRmsFloor > 0 && safePeak >= settings.peak
            ? safeRms / settings.peakRmsFloor
            : 0;
        const level = Math.max(rmsRatio, Math.min(peakRatio, peakFloorRatio)) * 100;
        const percent = Math.max(0, Math.min(100, Math.round(level)));
        let color = "rgba(100, 116, 139, 0.72)";
        if (percent >= 86) {
          color = "#be123c";
        } else if (percent >= 68) {
          color = "#d97706";
        } else if (percent > 0) {
          color = "#14b8a6";
        }
        if (humanInputLevelEl) {
          humanInputLevelEl.style.setProperty(
            "--human-input-level-width",
            `${percent}%`,
          );
          humanInputLevelEl.style.setProperty("--human-input-level-color", color);
          humanInputLevelEl.setAttribute("aria-valuenow", String(percent));
          humanInputLevelEl.title = `Microphone input level ${percent}%`;
        }
        if (humanInputLevelFillEl) {
          humanInputLevelFillEl.style.background = color;
        }
      }

      function selectedHumanMicrophoneDeviceId() {
        return humanMicrophoneSelect ? humanMicrophoneSelect.value || "" : "";
      }

      function clampHumanInputGain(value) {
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) {
          return HUMAN_INPUT_GAIN_DEFAULT;
        }
        return Math.max(
          HUMAN_INPUT_GAIN_MIN,
          Math.min(HUMAN_INPUT_GAIN_MAX, numeric),
        );
      }

      function formatHumanInputGain(value) {
        return `${clampHumanInputGain(value).toFixed(2)}x`;
      }

      function humanInputGainValue() {
        if (!humanInputGainSlider) {
          return HUMAN_INPUT_GAIN_DEFAULT;
        }
        return clampHumanInputGain(humanInputGainSlider.value);
      }

      function normalizeHumanAlwaysSensitivity(value) {
        const normalized = String(value || "").trim();
        return Object.prototype.hasOwnProperty.call(
          HUMAN_ALWAYS_SENSITIVITY_PROFILES,
          normalized,
        )
          ? normalized
          : HUMAN_ALWAYS_SENSITIVITY_DEFAULT;
      }

      function humanAlwaysSensitivityValue() {
        if (!humanAlwaysSensitivitySelect) {
          return HUMAN_ALWAYS_SENSITIVITY_DEFAULT;
        }
        return normalizeHumanAlwaysSensitivity(humanAlwaysSensitivitySelect.value);
      }

      function humanAlwaysSensitivitySettings() {
        return HUMAN_ALWAYS_SENSITIVITY_PROFILES[humanAlwaysSensitivityValue()];
      }

      function storedHumanAlwaysSensitivity() {
        try {
          return normalizeHumanAlwaysSensitivity(
            window.localStorage.getItem(HUMAN_ALWAYS_SENSITIVITY_STORAGE_KEY),
          );
        } catch (error) {
          return HUMAN_ALWAYS_SENSITIVITY_DEFAULT;
        }
      }

      function storeHumanAlwaysSensitivity(value) {
        try {
          window.localStorage.setItem(
            HUMAN_ALWAYS_SENSITIVITY_STORAGE_KEY,
            normalizeHumanAlwaysSensitivity(value),
          );
        } catch (error) {
          // Browsers may deny storage for sandboxed iframes.
        }
      }

      function setHumanAlwaysSensitivity(value, { persist } = { persist: true }) {
        const sensitivity = normalizeHumanAlwaysSensitivity(value);
        if (humanAlwaysSensitivitySelect) {
          humanAlwaysSensitivitySelect.value = sensitivity;
        }
        resetHumanAlwaysBargeInDetection();
        updateHumanInputLevel(humanCurrentPeak, humanCurrentRms);
        if (persist) {
          storeHumanAlwaysSensitivity(sensitivity);
        }
        return sensitivity;
      }

      function storedHumanInputGain() {
        try {
          const stored = window.localStorage.getItem(HUMAN_INPUT_GAIN_STORAGE_KEY);
          return stored ? clampHumanInputGain(stored) : HUMAN_INPUT_GAIN_DEFAULT;
        } catch (error) {
          return HUMAN_INPUT_GAIN_DEFAULT;
        }
      }

      function storeHumanInputGain(value) {
        try {
          window.localStorage.setItem(
            HUMAN_INPUT_GAIN_STORAGE_KEY,
            String(clampHumanInputGain(value)),
          );
        } catch (error) {
          // Browsers may deny storage for sandboxed iframes.
        }
      }

      function setHumanInputGain(value, { persist } = { persist: true }) {
        const gain = clampHumanInputGain(value);
        if (humanInputGainSlider) {
          humanInputGainSlider.value = String(gain);
        }
        if (humanInputGainValueEl) {
          humanInputGainValueEl.textContent = formatHumanInputGain(gain);
        }
        if (persist) {
          storeHumanInputGain(gain);
        }
        return gain;
      }

      function storedHumanMicrophoneDeviceId() {
        try {
          return window.localStorage.getItem(HUMAN_MICROPHONE_STORAGE_KEY) || "";
        } catch (error) {
          return "";
        }
      }

      function storeHumanMicrophoneDeviceId(deviceId) {
        try {
          if (deviceId) {
            window.localStorage.setItem(HUMAN_MICROPHONE_STORAGE_KEY, deviceId);
          } else {
            window.localStorage.removeItem(HUMAN_MICROPHONE_STORAGE_KEY);
          }
        } catch (error) {
          // Browsers may deny storage for sandboxed iframes.
        }
      }

      async function refreshHumanMicrophones() {
        if (!humanMicrophoneSelect) {
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          humanMicrophoneSelect.innerHTML =
            '<option value="">Default microphone</option>';
          return;
        }
        let devices = [];
        try {
          devices = await navigator.mediaDevices.enumerateDevices();
        } catch (error) {
          return;
        }
        const audioInputs = devices.filter((device) => device.kind === "audioinput");
        const selected = selectedHumanMicrophoneDeviceId() || storedHumanMicrophoneDeviceId();
        humanMicrophoneSelect.innerHTML = "";
        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "Default microphone";
        humanMicrophoneSelect.appendChild(defaultOption);
        audioInputs.forEach((device, index) => {
          const option = document.createElement("option");
          option.value = device.deviceId;
          option.textContent = device.label || `Microphone ${index + 1}`;
          humanMicrophoneSelect.appendChild(option);
        });
        if (selected && audioInputs.some((device) => device.deviceId === selected)) {
          humanMicrophoneSelect.value = selected;
        } else {
          humanMicrophoneSelect.value = "";
          if (selected) {
            storeHumanMicrophoneDeviceId("");
          }
        }
        setFrameHeight();
      }

      async function humanMicrophoneProbeCandidates() {
        const candidates = [{ deviceId: "", label: "Default microphone" }];
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          return candidates;
        }
        let devices = [];
        try {
          devices = await navigator.mediaDevices.enumerateDevices();
        } catch (error) {
          return candidates;
        }
        const currentDeviceId = selectedHumanMicrophoneDeviceId();
        devices
          .filter((device) => device.kind === "audioinput")
          .forEach((device, index) => {
            if (device.deviceId === currentDeviceId) {
              return;
            }
            candidates.push({
              deviceId: device.deviceId,
              label: device.label || `Microphone ${index + 1}`,
            });
          });
        return candidates;
      }

      async function probeHumanMicrophoneSignal(candidate) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return null;
        }
        let stream = null;
        let context = null;
        let source = null;
        let analyser = null;
        let silenceGain = null;
        try {
          stream = await navigator.mediaDevices.getUserMedia(
            humanAudioConstraintsForDevice(candidate.deviceId),
          );
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          context = new AudioContextClass();
          source = context.createMediaStreamSource(stream);
          analyser = context.createAnalyser();
          analyser.fftSize = 2048;
          silenceGain = context.createGain();
          silenceGain.gain.value = 0.000001;
          source.connect(analyser);
          analyser.connect(silenceGain);
          silenceGain.connect(context.destination);
          await context.resume();
          const samples = new Float32Array(analyser.fftSize);
          const startedAt = performance.now();
          let peak = 0;
          let sumRms = 0;
          let sampleWindows = 0;
          while (performance.now() - startedAt < HUMAN_MIC_PROBE_MS) {
            analyser.getFloatTimeDomainData(samples);
            const stats = floatSignalStats(samples);
            peak = Math.max(peak, stats.peak);
            sumRms += stats.rms;
            sampleWindows += 1;
            await delay(80);
          }
          const rms = Math.round(sumRms / Math.max(1, sampleWindows));
          return {
            deviceId: candidate.deviceId,
            label: candidate.label,
            peak,
            rms,
            hasSignal:
              peak >= HUMAN_MIC_PROBE_SIGNAL_PEAK ||
              rms >= HUMAN_MIC_PROBE_SIGNAL_RMS,
          };
        } catch (error) {
          return {
            deviceId: candidate.deviceId,
            label: candidate.label,
            peak: 0,
            rms: 0,
            hasSignal: false,
          };
        } finally {
          if (source) {
            source.disconnect();
          }
          if (silenceGain) {
            silenceGain.disconnect();
          }
          if (context) {
            void context.close();
          }
          if (stream) {
            stream.getTracks().forEach((track) => track.stop());
          }
        }
      }

      function baseHumanAudioConstraints() {
        return {
          channelCount: { ideal: 1 },
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: false,
        };
      }

      function humanAudioConstraints() {
        const deviceId = selectedHumanMicrophoneDeviceId();
        const audio = baseHumanAudioConstraints();
        if (deviceId) {
          audio.deviceId = { exact: deviceId };
        }
        return audio;
      }

      function humanAudioConstraintsForDevice(deviceId) {
        const audio = baseHumanAudioConstraints();
        if (deviceId) {
          audio.deviceId = { exact: deviceId };
        }
        return {
          audio,
          video: false,
        };
      }

      function humanMicrophoneIsOn() {
        return Boolean(
          humanInputStream &&
            humanInputStream
              .getAudioTracks()
              .some((track) => track.readyState === "live" && track.enabled),
        );
      }

      function humanMicrophoneTrackLabel() {
        if (!humanInputStream) {
          return "";
        }
        const track = humanInputStream
          .getAudioTracks()
          .find((candidate) => candidate.readyState === "live");
        return track && track.label ? track.label : "";
      }

      function humanMicrophoneOnStatus() {
        const label = humanMicrophoneTrackLabel();
        return label ? `microphone on: ${label}` : "microphone on";
      }

      function updateHumanRecordButtonLabel() {
        humanRecordButton.textContent = humanAlwaysRecordingEnabled
          ? "Listening"
          : "Hold to talk";
        humanRecordButton.setAttribute(
          "aria-pressed",
          humanRecording || humanRecordingStarting ? "true" : "false",
        );
      }

      function resetHumanAlwaysRestartState() {
        humanAlwaysVadRestartPending = false;
        humanAlwaysVadSawRuntimeBusy = false;
      }

      function resetHumanAlwaysBargeInDetection() {
        humanAlwaysBargeInSignalActiveMs = 0;
        humanAlwaysBargeInSignalElapsedMs = 0;
        humanAlwaysBargeInSignalQuietMs = 0;
      }

      function resetHumanAlwaysBargeInControllerState() {
        humanAlwaysBargeInControllerActive = false;
      }

      function resetHumanAlwaysAutoStopDetection() {
        humanAlwaysAutoStopSpeechActiveMs = 0;
        humanAlwaysAutoStopLastSampleMs = 0;
        humanAlwaysAutoStopAudioMs = 0;
        humanAlwaysAutoStopSpeechDetected = false;
        humanAlwaysAutoStopLastSpeechAt = 0;
        humanAlwaysAutoStopRequested = false;
      }

      function alwaysInputModeForCurrentRuntimeState() {
        return alwaysInputModeForRuntimeStatus(latestRuntimeStatus);
      }

      function canStartAlwaysInputFromLevel() {
        const inputMode = alwaysInputModeForCurrentRuntimeState();
        if (humanInputPaused() || !inputMode) return false;
        if (
          !humanAlwaysRecordingEnabled ||
          humanRecording ||
          humanRecordingStarting ||
          humanRecordingStopping ||
          humanStreamingSocket ||
          humanAlwaysBargeInControllerActive ||
          warmupActive
        ) {
          return false;
        }
        if (humanAlwaysVadRestartPending && inputMode) {
          humanAlwaysVadSawRuntimeBusy = true;
        }
        return (
          Date.now() - humanAlwaysBargeInLastStartedAt >=
          HUMAN_ALWAYS_BARGE_IN_COOLDOWN_MS
        );
      }

      function humanAlwaysBargeInSignalDetected(
        peak,
        rms,
        settings = humanAlwaysSensitivitySettings(),
      ) {
        return (
          rms >= settings.rms ||
          (peak >= settings.peak && rms >= settings.peakRmsFloor)
        );
      }

      function humanAlwaysBargeInSignalConfirmed(peak, rms, sampleDurationMs) {
        const settings = humanAlwaysSensitivitySettings();
        if (!humanAlwaysBargeInSignalDetected(peak, rms, settings)) {
          humanAlwaysBargeInSignalQuietMs += sampleDurationMs;
          if (humanAlwaysBargeInSignalQuietMs >= HUMAN_ALWAYS_BARGE_IN_SIGNAL_GAP_MS) {
            resetHumanAlwaysBargeInDetection();
          } else if (humanAlwaysBargeInSignalActiveMs > 0) {
            humanAlwaysBargeInSignalElapsedMs += sampleDurationMs;
          }
          return false;
        }
        // Use the captured audio duration, including short unvoiced gaps.
        // Sparse analyser snapshots can miss speech that the PCM stream records.
        humanAlwaysBargeInSignalQuietMs = 0;
        humanAlwaysBargeInSignalActiveMs += sampleDurationMs;
        humanAlwaysBargeInSignalElapsedMs += sampleDurationMs;
        return (
          humanAlwaysBargeInSignalActiveMs >=
            settings.requiredWindows * HUMAN_ALWAYS_BARGE_IN_SIGNAL_WINDOW_MS &&
          humanAlwaysBargeInSignalElapsedMs >= settings.minActiveMs
        );
      }

      function maybeStartAlwaysBargeInFromLevel(peak, rms, sampleDurationMs = 250) {
        if (!canStartAlwaysInputFromLevel()) {
          resetHumanAlwaysBargeInDetection();
          return false;
        }
        if (!humanAlwaysBargeInSignalConfirmed(peak, rms, sampleDurationMs)) {
          return false;
        }
        resetHumanAlwaysBargeInDetection();
        resetHumanAlwaysRestartState();
        humanAlwaysBargeInLastStartedAt = Date.now();
        const inputMode =
          alwaysInputModeForCurrentRuntimeState() ||
          (args.runtime_status_url ? "status_refresh" : "");
        if (!inputMode) {
          return false;
        }
        setHumanStatus(
          inputMode === "barge_in"
            ? "always barge-in; opening human input"
            : "always speech detected; opening human input",
        );
        void startAlwaysHumanInputFromMonitor(inputMode);
        return true;
      }

      function canInterruptPlaybackFromAlwaysRecording() {
        if (
          !humanAlwaysRecordingEnabled ||
          !humanRecording ||
          humanInputPaused() ||
          activeSources.size === 0 ||
          !runtimeStartRequested ||
          warmupActive
        ) {
          return false;
        }
        return (
          Date.now() - humanAlwaysBargeInLastStartedAt >=
          HUMAN_ALWAYS_BARGE_IN_COOLDOWN_MS
        );
      }

      function maybeInterruptActivePlaybackFromAlwaysRecording(peak, rms, sampleDurationMs = 250) {
        if (!canInterruptPlaybackFromAlwaysRecording()) {
          resetHumanAlwaysBargeInDetection();
          return false;
        }
        if (!humanAlwaysBargeInSignalConfirmed(peak, rms, sampleDurationMs)) {
          return false;
        }
        resetHumanAlwaysBargeInDetection();
        humanAlwaysBargeInLastStartedAt = Date.now();
        setHumanStatus("always barge-in; interrupting playback");
        humanRecordingStartedByBargeIn = true;
        void interruptActiveMainPlayback({}, { reason: "human_barge_in" }).then(
          (interrupted) => {
            if (!interrupted) {
              setHumanStatus("always listening; no playback to interrupt");
            }
          },
        );
        return true;
      }

      async function startAlwaysHumanInputFromMonitor(inputMode) {
        if (humanAlwaysBargeInControllerActive) {
          return false;
        }
        humanAlwaysBargeInControllerActive = true;
        humanAlwaysPendingPreRoll = consumeHumanAlwaysMonitorPreRoll();
        try {
          let resolvedInputMode = inputMode;
          if (resolvedInputMode === "status_refresh" || !resolvedInputMode) {
            setHumanStatus("always speech detected; checking runtime");
            const status = await fetchRuntimeStatus();
            if (status) {
              updateRuntimeInlineStateFromStatus(status);
              const errorMessage = runtimeStatusHumanInputError(status);
              if (errorMessage) {
                setHumanStatus(errorMessage);
                setStatus(errorMessage);
                return false;
              }
            }
            resolvedInputMode = alwaysInputModeForCurrentRuntimeState();
            if (!resolvedInputMode) {
              setHumanStatus(
                alwaysArmedStatusForRuntimeStatus(latestRuntimeStatus),
              );
              return false;
            }
          }
          if (resolvedInputMode === "barge_in") {
            setHumanStatus("always barge-in; opening human input");
            const interrupted = await interruptPlaybackForHumanBargeIn();
            if (!interrupted) {
              setHumanStatus("always barge-in failed; monitoring");
              return false;
            }
            setHumanStatus("barge-in; waiting for human input slot");
            if (!(await waitForRuntimeHumanInputAfterBargeIn())) {
              return false;
            }
          } else {
            setHumanStatus("always speech detected; opening human input");
          }
          const pendingPreRoll = humanAlwaysPendingPreRoll;
          humanAlwaysPendingPreRoll = null;
          humanAlwaysVadInputAllowed = true;
          await startHumanRecording({
            allowActivePlayback: resolvedInputMode === "barge_in",
            alwaysPreRoll: pendingPreRoll,
            startedByBargeIn: resolvedInputMode === "barge_in",
          });
          return humanRecording || humanRecordingStarting;
        } finally {
          const streamerStarted = humanRecording || humanRecordingStarting;
          humanAlwaysBargeInControllerActive = false;
          if (!streamerStarted) {
            humanAlwaysPendingPreRoll = null;
            resetHumanAlwaysAutoStopDetection();
            resetHumanAlwaysBargeInDetection();
            resumeAlwaysMonitorIfIdle();
          }
        }
      }

      async function maybeResumeAlwaysHumanRecordingFromStatus(status) {
        if (
          !humanAlwaysRecordingEnabled ||
          humanRecording ||
          humanRecordingStarting ||
          humanRecordingStopping ||
          humanStreamingSocket ||
          humanAlwaysBargeInControllerActive
        ) {
          return;
        }
        const canRecord = runtimeStatusAllowsHumanRecording(status, {
          ignoreActivePlayback: true,
        });
        if (humanInputStream && !humanLevelAnalyser) {
          startHumanLevelMeter(humanInputStream);
        }
        if (humanInputStream) {
          void startAlwaysBargeInCaptureMonitor();
        }
        if ((status || {}).human_input_state === "waiting_to_resume_interrupted_ai") {
          humanAlwaysAiResumePending = true;
        }
        if (humanAlwaysAiResumePending) {
          if (canRecord && !humanInputPaused(status)) {
            setHumanStatus("発話がなければ、まもなくAIが話を再開します。");
            return;
          }
          humanAlwaysAiResumePending = false;
        }
        if (humanAlwaysVadRestartPending) {
          if (!canRecord) {
            humanAlwaysVadSawRuntimeBusy = true;
            humanAlwaysVadInputAllowed = false;
            return;
          }
          resetHumanAlwaysRestartState();
        }
        if (!canRecord) {
          humanAlwaysVadInputAllowed = false;
          setHumanStatus(alwaysArmedStatusForRuntimeStatus(status));
          return;
        }
        humanAlwaysVadInputAllowed = true;
        setHumanStatus("always starting");
        await startHumanRecording({ allowActivePlayback: true });
      }

      function humanMicrophoneTrackDiagnostic() {
        if (!humanInputStream) {
          return "track none";
        }
        const track = humanInputStream
          .getAudioTracks()
          .find((candidate) => candidate.readyState === "live");
        if (!track) {
          return "track none";
        }
        let settings = {};
        try {
          settings = track.getSettings ? track.getSettings() || {} : {};
        } catch (error) {
          settings = {};
        }
        const details = [
          `track ${track.readyState}`,
          track.enabled ? "enabled" : "disabled",
          track.muted ? "muted" : "unmuted",
        ];
        if (settings.sampleRate) {
          details.push(`${settings.sampleRate}Hz`);
        }
        if (settings.channelCount) {
          details.push(`${settings.channelCount}ch`);
        }
        if (humanMicrophoneConstraintStatus) {
          details.push(humanMicrophoneConstraintStatus);
        }
        return details.join(" ");
      }

      function humanCaptureDiagnostic() {
        const channelSummary = humanCaptureChannelSummary
          ? `; ${humanCaptureChannelSummary}`
          : "";
        return `capture frames ${humanCaptureFrameCount} peak ${humanCapturePeak} rms ${humanCaptureRms}${channelSummary}`;
      }

      function scaledHumanCaptureChannels(peaks, rmss, selectedChannelIndex) {
        if (!peaks || peaks.length <= 0) {
          return "";
        }
        const parts = [];
        for (let index = 0; index < peaks.length; index += 1) {
          const marker = index === selectedChannelIndex ? "*" : "";
          const peak = Math.round(Math.abs(Number(peaks[index]) || 0) * 1000);
          const rms = Math.round(Math.abs(Number((rmss || [])[index]) || 0) * 1000);
          parts.push(`ch${index}${marker} peak ${peak} rms ${rms}`);
        }
        return `capture ${parts.join("; ")}`;
      }

      function normalizeHumanCaptureMessage(data) {
        if (data && data.length) {
          return {
            buffer: new Float32Array(data),
            channelSummary: "",
          };
        }
        if (!data || !data.buffer || !data.buffer.length) {
          return null;
        }
        return {
          buffer: new Float32Array(data.buffer),
          channelSummary: scaledHumanCaptureChannels(
            data.channelPeaks,
            data.channelRms,
            Number(data.selectedChannelIndex),
          ),
        };
      }

      async function applyPreferredHumanTrackConstraints(stream) {
        humanMicrophoneConstraintStatus = "";
        if (!stream) {
          return;
        }
        const track = stream
          .getAudioTracks()
          .find((candidate) => candidate.readyState === "live");
        if (!track || !track.applyConstraints) {
          return;
        }
        let beforeSettings = {};
        try {
          beforeSettings = track.getSettings ? track.getSettings() || {} : {};
        } catch (error) {
          beforeSettings = {};
        }
        const beforeChannelCount = Number(beforeSettings.channelCount || 0);
        if (beforeChannelCount > 0 && beforeChannelCount <= 1) {
          humanMicrophoneConstraintStatus = "mono input";
          return;
        }
        try {
          await track.applyConstraints({ channelCount: 1 });
          let afterSettings = {};
          try {
            afterSettings = track.getSettings ? track.getSettings() || {} : {};
          } catch (error) {
            afterSettings = {};
          }
          const afterChannelCount = Number(afterSettings.channelCount || 0);
          if (afterChannelCount > 0 && afterChannelCount <= 1) {
            humanMicrophoneConstraintStatus = "mono constraint applied";
          } else if (afterChannelCount > 1) {
            humanMicrophoneConstraintStatus = `mono requested; browser kept ${afterChannelCount}ch`;
          } else {
            humanMicrophoneConstraintStatus = "mono requested";
          }
        } catch (error) {
          humanMicrophoneConstraintStatus = "mono request rejected";
        }
      }

      async function ensureHumanMicrophoneEnabled() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setHumanStatus("microphone is not available");
          return false;
        }
        if (humanMicrophoneIsOn()) {
          if (!humanLevelAnalyser && humanInputStream) {
            startHumanLevelMeter(humanInputStream);
          }
          return true;
        }
        if (humanMicrophoneOpening) {
          return humanMicrophoneOpening;
        }
        humanMicrophoneOpening = (async () => {
          setHumanStatus("requesting microphone");
          try {
            humanInputStream = await navigator.mediaDevices.getUserMedia({
              audio: humanAudioConstraints(),
              video: false,
            });
            humanInputStream.getAudioTracks().forEach((track) => {
              track.addEventListener("ended", () => {
                if (humanInputStream && humanInputStream.getTracks().includes(track)) {
                  humanInputStream = null;
                }
                stopHumanLevelMeter();
                setHumanStatus("microphone off");
              });
            });
            await applyPreferredHumanTrackConstraints(humanInputStream);
            await refreshHumanMicrophones();
            startHumanLevelMeter(humanInputStream);
            setHumanStatus(humanMicrophoneOnStatus());
            return true;
          } catch (error) {
            humanInputStream = null;
            stopHumanLevelMeter();
            setHumanStatus(describeMicrophoneError(error));
            return false;
          } finally {
            humanMicrophoneOpening = null;
          }
        })();
        return humanMicrophoneOpening;
      }

      function stopHumanMicrophone(statusText) {
        if (humanRecording) {
          setHumanStatus("stop recording before pausing mic");
          return;
        }
        resetHumanAlwaysBargeInControllerState();
        resetHumanAlwaysMonitorPreRoll();
        resetHumanAlwaysPendingPreRoll();
        cleanupHumanRecording();
        stopHumanLevelMeter();
        if (humanInputStream) {
          humanInputStream.getTracks().forEach((track) => track.stop());
          humanInputStream = null;
        }
        humanMicrophoneConstraintStatus = "";
        setHumanStatus(statusText || "microphone off");
      }

      function resetHumanInputStreamAfterSilentCapture() {
        resetHumanAlwaysBargeInControllerState();
        resetHumanAlwaysMonitorPreRoll();
        resetHumanAlwaysPendingPreRoll();
        stopHumanLevelMeter();
        if (humanInputStream) {
          humanInputStream.getTracks().forEach((track) => track.stop());
          humanInputStream = null;
        }
        humanMicrophoneConstraintStatus = "";
      }

      async function selectHumanMicrophoneDeviceId(deviceId) {
        await refreshHumanMicrophones();
        if (humanMicrophoneSelect) {
          const exists = Array.from(humanMicrophoneSelect.options).some(
            (option) => option.value === deviceId,
          );
          humanMicrophoneSelect.value = exists ? deviceId : "";
        }
        storeHumanMicrophoneDeviceId(selectedHumanMicrophoneDeviceId());
      }

      async function restartAlwaysRecordingWithMicrophone(candidate, probeResult) {
        await selectHumanMicrophoneDeviceId(candidate.deviceId);
        setHumanStatus(
          `auto microphone selected: ${candidate.label} peak ${probeResult.peak} rms ${probeResult.rms}`,
        );
        if (humanRecording || humanRecordingStarting) {
          await requestHumanRecordingStop();
        }
        await ensureHumanMicrophoneEnabled();
        if (!args.runtime_status_url) {
          void startHumanRecording();
          return;
        }
        const deadline = Date.now() + HUMAN_BARGE_IN_STATUS_WAIT_MS;
        while (Date.now() <= deadline) {
          const status = await fetchRuntimeStatus();
          if (status) {
            updateRuntimeInlineStateFromStatus(status);
            await maybeResumeAlwaysHumanRecordingFromStatus(status);
            if (humanRecording || humanRecordingStarting) {
              return;
            }
          }
          await delay(HUMAN_BARGE_IN_STATUS_POLL_MS);
        }
      }

      async function autoRecoverHumanMicrophoneFromSilence() {
        if (
          humanMicrophoneAutoRecovering ||
          !humanAlwaysRecordingEnabled ||
          (!humanRecording && !humanRecordingStarting)
        ) {
          return;
        }
        const now = Date.now();
        if (
          now - humanMicrophoneAutoRecoverLastAt <
          HUMAN_SILENT_MIC_AUTO_RECOVER_COOLDOWN_MS
        ) {
          return;
        }
        humanMicrophoneAutoRecovering = true;
        humanMicrophoneAutoRecoverLastAt = now;
        try {
          setHumanStatus("microphone silent; searching inputs");
          const candidates = await humanMicrophoneProbeCandidates();
          for (const candidate of candidates) {
            const probeResult = await probeHumanMicrophoneSignal(candidate);
            if (!probeResult) {
              continue;
            }
            if (probeResult.hasSignal) {
              await restartAlwaysRecordingWithMicrophone(candidate, probeResult);
              return;
            }
          }
          setHumanStatus("microphone silent; no active input found");
        } finally {
          humanMicrophoneAutoRecovering = false;
        }
      }

      function maybeAutoRecoverHumanMicrophoneFromSilence(elapsedMs) {
        if (
          elapsedMs < HUMAN_SILENT_MIC_AUTO_RECOVER_MS ||
          humanCaptureFrameCount <= 0 ||
          humanCapturePeak > 0 ||
          humanCaptureRms > 0 ||
          !humanAlwaysRecordingEnabled ||
          !humanRecording
        ) {
          return false;
        }
        void autoRecoverHumanMicrophoneFromSilence();
        return true;
      }

      async function refreshHumanMicrophoneForRecording() {
        if (humanInputStream) {
          stopHumanLevelMeter();
          humanInputStream.getTracks().forEach((track) => track.stop());
          humanInputStream = null;
        }
        return ensureHumanMicrophoneEnabled();
      }

      async function recoverRuntimeStartRequestedFromStatus() {
        if (runtimeStartRequested) {
          return { recovered: true, blocked: false };
        }
        const status = await fetchRuntimeStatus();
        if (!status) {
          return { recovered: false, blocked: false };
        }
        updateRuntimeInlineStateFromStatus(status);
        const errorMessage = runtimeStatusHumanInputError(status);
        if (errorMessage) {
          setHumanStatus(errorMessage);
          setStatus(errorMessage);
          return { recovered: false, blocked: true };
        }
        return { recovered: runtimeStartRequested, blocked: false };
      }

      async function canStartHumanRecording(options = {}) {
        if (humanInputPaused()) {
          setHumanStatus("一時停止中です。Resumeを押してください。");
          return false;
        }
        const allowPlaybackBargeIn = Boolean(options.allowPlaybackBargeIn);
        const allowActivePlayback = Boolean(
          options.allowActivePlayback || allowPlaybackBargeIn,
        );
        if (!runtimeHasHumanInput()) {
          setHumanStatus("push-to-talk disabled");
          return false;
        }
        if (!humanAudioStreamUrl() && !args.human_audio_url) {
          setHumanStatus("missing human audio url");
          return false;
        }
        if (!runtimeStartRequested) {
          const runtimeStartRecovery = await recoverRuntimeStartRequestedFromStatus();
          if (runtimeStartRecovery.blocked) {
            return false;
          }
          if (!runtimeStartRecovery.recovered) {
            setHumanStatus("start runtime first");
            return false;
          }
        }
        if (warmupActive) {
          setHumanStatus("AI speech is buffering; wait to talk");
          return false;
        }
        if (activeSources.size > 0 && !allowActivePlayback) {
          setHumanStatus("AI speech is playing; wait to talk");
          return false;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setHumanStatus("microphone is not available");
          return false;
        }
        return true;
      }

      function runtimeStatusHumanInputError(status) {
        const phase = String((status || {}).phase || "");
        const message = String((status || {}).error_message || "").trim();
        if (phase !== "error") {
          return "";
        }
        if (message.includes("maximum duration") || message.includes("60 minutes")) {
          return "runtime session expired; click Refresh & Reconnect";
        }
        return message
          ? `runtime error; click Refresh & Reconnect: ${message}`
          : "runtime error; click Refresh & Reconnect";
      }

      async function ensureRuntimeReadyForHumanRecording() {
        if (!args.runtime_status_url) {
          return !runtimeIsHumanClientMode();
        }
        try {
          const response = await window.fetch(args.runtime_status_url, {
            method: "GET",
            mode: "cors",
            cache: "no-store",
          });
          if (!response.ok) {
            return !runtimeIsHumanClientMode();
          }
          const status = await response.json();
          updateRuntimeStartRequestedFromStatus(status);
          updateRuntimeInlineStateFromStatus(status);
          const errorMessage = runtimeStatusHumanInputError(status);
          if (errorMessage) {
            setHumanStatus(errorMessage);
            setStatus(errorMessage);
            return false;
          }
          if (humanInputPaused(status)) {
            setHumanStatus("一時停止中です。Resumeを押してください。");
            return false;
          }
          return !runtimeIsHumanClientMode(status) || Boolean(humanSpeakerId(status) && humanRecipientIds().length);
        } catch (error) {
          return !runtimeIsHumanClientMode();
        }
      }

      async function waitForRuntimeHumanInputAfterBargeIn() {
        if (!args.runtime_status_url) {
          return true;
        }
        const deadline = Date.now() + HUMAN_BARGE_IN_STATUS_WAIT_MS;
        while (Date.now() <= deadline) {
          const status = await fetchRuntimeStatus();
          if (status) {
            updateRuntimeInlineStateFromStatus(status);
            const errorMessage = runtimeStatusHumanInputError(status);
            if (errorMessage) {
              setHumanStatus(errorMessage);
              setStatus(errorMessage);
              return false;
            }
            if (
              runtimeStatusAllowsHumanRecording(status, {
                ignoreActivePlayback: true,
              })
            ) {
              return true;
            }
          }
          await delay(HUMAN_BARGE_IN_STATUS_POLL_MS);
        }
        setHumanStatus("barge-in failed; runtime not ready for human input");
        return false;
      }

      function interruptPayloadForRuntimeStatus(status, options = {}) {
        const payload = {
          played_ms: 0,
          reason: String(options.reason || "human_barge_in"),
        };
        const speaker = runtimeStatusActiveSpeaker(status);
        if (speaker) {
          payload.speaker = speaker;
        }
        const turnId = Number((status || {}).current_turn_id);
        if (Number.isFinite(turnId) && turnId >= 0) {
          payload.turn_id = Math.floor(turnId);
        }
        return payload;
      }

      async function interruptRuntimePlaybackFromStatus(status, options = {}) {
        if (!runtimeStatusAllowsAlwaysBargeIn(status)) {
          return false;
        }
        if (!args.runtime_interrupt_url) {
          setStatus("runtime interrupt failed: missing url");
          return false;
        }
        return postRuntimeControl(
          args.runtime_interrupt_url,
          "runtime interrupt failed",
