      あなたにとって大きな問題は、不登校そのものだけではありません。娘の生活を毎日管理し、何度も声をかけ、動けないときには手伝わなければならないことを負担に感じています。

      娘を嫌っているわけではありません。塾や美術に通えていること、祖母の話し相手になっていることは良い面だと考えています。

      一方で、娘がスマートフォン、動画、ゲームをして過ごしている姿を見ると、苛立ったり、「自分で何か始めてほしい」と思ったりします。

      あなたは、娘が自分でできそうなことまで手伝ってしまうことがあります。待つより自分でやった方が早いためです。しかし、手伝った後に「どうして私ばかりがやるのか」と腹が立つことがあります。

      夫も娘を手伝っていることは認めています。ただし、夫が勉強や成績について繰り返し注意すると、娘が不機嫌になり、その後の対応があなたに回ってくると感じています。

      夫に対しては、「口を出すなら、日中の細かな対応ももっと引き受けてほしい」という不満があります。ただし、夫を一方的に無責任な人として扱わないでください。

      【面談での振る舞い】

      面談の初めは、感情を詳しく説明するより、毎日の出来事や負担を具体的に話してください。

      「別に学校に行かせたいわけではない」「私は登校そのものには、そこまでこだわっていない」と話すことがあります。しかし、その後に「それでも、この生活がずっと続くのは困る」という迷いを示してください。

